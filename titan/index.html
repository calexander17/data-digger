<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>League of Titans Data Digger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Titans"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e060b"><meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: navy masthead with varsity lettering and tab rail; each tab is a "back of the trading card" ledger on card stock */
:root{
  --bg:#e9edf2; --card:#f8fafc; --ink:#14213d; --muted:#5a6680; --rule:#cfd6e1; --soft:#dfe5ed;
  --accent:#d9531e; --accent-ink:#ffffff; --hl:#fde3d6; --win:#1f8a5b; --loss:#c23b3b; --gold:#b8860b;
  --fl:0.62; --fc:0.13;
  --display:"Graduate","Rockwell","Georgia",serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --card:#151f35; --ink:#e6ebf4; --muted:#93a0b8; --rule:#27344f; --soft:#1c2842;
  --accent:#ff8650; --accent-ink:#1a0d06; --hl:#3a2418; --win:#4cc28d; --loss:#ff7a7a; --gold:#e8b84a; --fl:0.72; --fc:0.12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#151f35; --ink:#e6ebf4; --muted:#93a0b8; --rule:#27344f; --soft:#1c2842;
  --accent:#ff8650; --accent-ink:#1a0d06; --hl:#3a2418; --win:#4cc28d; --loss:#ff7a7a; --gold:#e8b84a; --fl:0.72; --fc:0.12; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#14213d}
.band{background:#14213d;color:#eef2f8;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 0 var(--accent)}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:12px 6px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,3vw,26px);margin:0;letter-spacing:.02em;line-height:1.1}
.brand span{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.search{position:relative;flex:1 1 260px;max-width:400px}
.search input{width:100%;box-sizing:border-box;font:600 15px var(--body);padding:9px 12px;border-radius:6px;border:2px solid transparent;background:#f8fafc;color:#14213d}
.search input:focus{outline:none;border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-height:340px;overflow:auto;margin:0;padding:4px;list-style:none;z-index:6}
.sugg li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--hl)}
.sugg small{font-family:var(--cond);color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;color:#c9d3e3;text-decoration:none;font:600 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px 10px;border-radius:6px 6px 0 0}
nav.tabs a:hover{color:#fff;background:rgb(255 255 255 / .06)}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
main{padding-block:24px 56px;display:grid;gap:24px}
h2.sec{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 2px;line-height:1.2}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.sub{font-size:13px;color:var(--muted)}
.eyebrow{font:600 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;min-width:0}
.pad{padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.fdot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--fcol);margin-right:7px;vertical-align:0}
.team{font-weight:700}
.owner{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font:700 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--hl);color:var(--ink);white-space:nowrap}
.tag.cur{background:var(--accent);color:var(--accent-ink)}
.tag.gold{background:var(--gold);color:#fff}
.tag.w{background:var(--win);color:#fff}.tag.l{background:var(--loss);color:#fff}
.plink,.flink,.tlink{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px;cursor:pointer;background:none;border:none;font:inherit;padding:0;text-align:left}
.plink:hover,.flink:hover,.tlink:hover{text-decoration-color:var(--accent)}
.self{font-weight:700;text-decoration:none;cursor:default}
:is(a,button,summary,select,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.controls label{display:grid;gap:3px;font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{font:500 14px var(--body);padding:7px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.btn{font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.on{background:var(--ink);color:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 13px var(--cond);padding:6px 10px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.list li:last-child{border-bottom:none}
.list .v{font-family:var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.rk{font:700 12px var(--cond);color:var(--muted);width:22px;flex:none}
.big{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.lk-bars{display:grid;gap:8px;margin-top:10px}
.lk-row{display:grid;grid-template-columns:minmax(0,9em) 1fr 3.2em;grid-template-areas:"n t v" ". s s";column-gap:10px;align-items:center}
.lk-name{grid-area:n;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk-track{grid-area:t;position:relative;height:12px;background:var(--soft);border-radius:6px}
.lk-mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--rule)}.lk-bar{position:absolute;top:0;bottom:0;border-radius:6px}
.lk-val{grid-area:v;text-align:right;font-variant-numeric:tabular-nums}.lk-sub{grid-area:s;font-size:12px}
.lk-grid td.lk-cell{text-align:center;cursor:pointer;padding:4px 2px;min-width:34px;line-height:1.1;border:2px solid transparent}.lk-grid td.lk-cell b{display:block;font-size:12px}.lk-grid td.lk-cell span{font-size:11px;opacity:.85}
.lk-grid td.lk-cell.on{border-color:var(--ink)}.lk-how summary{cursor:pointer}.lk-how p{max-width:68ch;margin:10px 0 0}
.dr-track{display:inline-block;vertical-align:middle;position:relative;width:90px;height:10px;background:var(--soft);border-radius:5px;margin-right:6px}.dr-mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--rule)}.dr-bar{position:absolute;top:0;bottom:0;border-radius:5px}
.dr-g td.dr-cell{text-align:center;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:6px 4px;border:2px solid transparent}.dr-g td.dr-cell.on{border-color:var(--ink)}
.dr-prow{display:grid;grid-template-columns:minmax(0,8em) 1fr;gap:10px;align-items:center}.dr-prow>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-pos{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--soft)}.dr-pos i{display:block;height:100%;color:#fff;font-size:10px;font-style:normal;font-weight:700;text-align:center;line-height:18px}
.dr-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}.dr-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.fc-rk{line-height:1.1;min-width:44px}.fc-rk b{display:block;font-size:15px}.fc-rk span{font-size:11px;opacity:.8}
.fc-pks{display:flex;flex-wrap:wrap;gap:4px}.fc-pk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;padding:2px 5px;border-radius:5px;border:1.5px solid var(--rule);font:700 11px var(--cond);line-height:1.1}.fc-pk.in{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.fc-pk small{font-size:9px;font-weight:600;opacity:.9}
/* ---- navigation: grouped tabs, sub-tabs, sticky section shortcuts, phone bottom bar ---- */
html{scroll-padding-top:var(--scrollPad,120px)}
nav.tabs a{display:inline-flex;align-items:center;gap:7px}
nav.tabs a svg{width:16px;height:16px;flex:none;opacity:.85}
.sbtn .ic-x{display:none}
.sbtn{display:none;background:none;border:0;color:#eef2f8;padding:8px;margin:-8px -6px -8px 0;border-radius:8px;cursor:pointer}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--subTop,0px));z-index:4;background:var(--bg);border-bottom:1px solid var(--rule)}
.subin{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.subin::-webkit-scrollbar{display:none}
.subin a{flex:none;font:600 14px var(--cond);letter-spacing:.04em;padding:7px 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);text-decoration:none;white-space:nowrap}
.subin a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--jumpTop,0px));z-index:3;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-block:-14px;padding-block:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.pills.jump::-webkit-scrollbar{display:none}
.pills.jump .pill{flex:none;white-space:nowrap}
@media (max-width:720px){
  .band{position:relative;top:0}
  .top{padding-block:10px 10px;flex-wrap:nowrap;gap:10px}
  .brand{flex:1 1 0;min-width:0}
  .sbtn{flex:none}
  .band.searching .sbtn .ic-x{display:block}.band.searching .sbtn .ic-s{display:none}
  .brand h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbtn{display:block}
  .search{display:none;flex-basis:100%;max-width:none}
  .band.searching .top{flex-wrap:wrap}
  .band.searching .search{display:block}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(var(--ntabs,6),minmax(0,1fr));gap:0;background:#14213d;border-top:2px solid var(--accent);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgb(0 0 0 / .18);overflow:visible}
  nav.tabs a{flex-direction:column;gap:3px;justify-content:center;font-size:10px;letter-spacing:.02em;padding:8px 1px 7px;border-radius:0;min-height:54px;text-align:center;white-space:nowrap;overflow:hidden}
  nav.tabs a span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:transparent;color:#ff9a6c}
  nav.tabs a[aria-current="page"] svg{opacity:1}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  nav.tabs a{font-size:9px;letter-spacing:0;padding-inline:0}
  nav.tabs a svg{width:20px;height:20px}
  .subin{padding-block:8px}
  .subin a{font-size:13.5px;padding:6px 12px}
  h2.sec{font-size:24px}
  .pad{padding:14px}
  td,th{padding:8px 9px}
}
.rk{display:inline-block}
.onlym{display:none}
select{max-width:100%}
.controls label{min-width:0;max-width:100%;grid-template-columns:minmax(0,1fr)}
.tbl td .flink,.tbl td .plink{white-space:nowrap}
.tbl td:has(> .fdot){white-space:nowrap}
@media (max-width:720px){
  .tbl td .flink.team{display:inline-block;max-width:10.5em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .tbl td .owner{white-space:nowrap}
  .tbl th{font-size:11px;letter-spacing:.06em}
  .xt{display:none}
  .split>aside{order:2}
  .fc-cap table{min-width:720px}.fc-cap .fc-pks{min-width:8.6em}
  body[data-tab="trades"] main>.tr-side{order:5}
  .fc-cap td:first-child,.fc-cap th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .lede{font-size:14.5px}
  .facts{grid-template-columns:1fr}
}
@media (max-width:560px){
  .onlym{display:block}
  .hm-i{display:none}
  .onlyg{display:grid;gap:2px}
  table.ledger thead{display:none}
  table.ledger,table.ledger tbody{display:block}
  table.ledger tr{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;column-gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule);border-left:6px solid var(--fcol)}
  table.ledger td{border:0;padding:0}
  table.ledger td.yr{border-left:0;width:auto;font-size:15px}
  table.ledger td.hm{display:none}
  table.ledger td:last-child{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
.tr-cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:170px;margin-top:12px}
.tr-m{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font:600 11px var(--cond);color:var(--muted)}
.tr-m i{display:block;width:100%;max-width:34px;background:color-mix(in srgb, var(--accent) 45%, var(--soft));border-radius:4px 4px 0 0}
.tr-m .num{color:var(--ink)}
.mc[data-fx][aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.hx{display:grid;gap:3px;margin-top:6px;font-size:13.5px;line-height:1.4}.hx .eyebrow{margin-right:4px;font-size:10.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.fact{padding:14px 16px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0}
.fact .sub{margin-top:6px}
/* champions */
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.champ{border-radius:10px;padding:14px 14px 12px;background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--fcol);display:grid;gap:6px;align-content:start}
.champ .yr{font-family:var(--display);font-size:24px;line-height:1}
.champ .nm{font-weight:700;line-height:1.25}
/* ledger */
.phead{padding:20px 22px 16px;display:grid;gap:12px;border-bottom:3px solid var(--ink)}
.pname{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;text-wrap:balance;font-weight:400}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--cond);font-size:15px;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.chip{height:24px;border-radius:3px;border:1.5px dashed var(--rule);display:grid;place-items:center;font:700 11px var(--cond);color:var(--muted)}
.chip.on{border:none;background:var(--fcol);color:#fff;text-shadow:0 1px 1px rgb(0 0 0 / .35)}
td.yr{font-family:var(--display);font-size:16px;white-space:nowrap;border-left:6px solid var(--fcol);width:1%}
.how{font-weight:600}
.when{font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;font:600 13px var(--cond);color:var(--accent);letter-spacing:.03em}
.deal{display:grid;gap:8px;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px}
.deal ul{margin:2px 0 0;padding-left:18px}
.note{font-size:13px;color:var(--muted);margin:0}
/* trades */
.trade{display:grid;gap:12px;padding:16px 18px}
.trade+.trade{border-top:1px solid var(--rule)}
.tsides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.tsides{grid-template-columns:1fr}}
.side{border-left:5px solid var(--fcol);padding:2px 0 2px 12px;min-width:0}
.side ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:14px}
.side li{display:flex;justify-content:space-between;gap:10px}
.side li .p{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.side .tot{font-family:var(--display);font-size:20px}
.verdict{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.verdict span{background:var(--fcol)}
.tmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
.tree{margin:6px 0 0 6px;padding-left:14px;border-left:2px dashed var(--rule);display:grid;gap:8px;font-size:13px}
.tree .node{display:grid;gap:2px}
/* matrix */
.matrix{border-collapse:separate;border-spacing:2px;width:auto;margin:0 auto}
.matrix th{padding:4px;font-size:11px;text-align:center;border:none}
.matrix th.rowh{text-align:right;white-space:nowrap;padding-right:6px}
.matrix td{border:none;padding:0}
.mc{width:46px;height:38px;border-radius:4px;display:grid;place-items:center;font:600 12px var(--cond);color:var(--ink);background:var(--soft);cursor:pointer;border:none;line-height:1.05;font-variant-numeric:tabular-nums}
.mc small{font-size:10px;opacity:.75;font-weight:500}
.mc.self{background:transparent;cursor:default}
.mc[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.colh{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:96px;margin:0 auto;line-height:1.2}
.colbar{height:5px;border-radius:2px;margin:5px auto 0;width:28px}
/* bars */
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .t{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.path .hop{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--soft)}
.path .arr{color:var(--muted)}
.more{display:flex;justify-content:center;padding:14px}
.lineage{display:grid;gap:0}
.lin{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.lin:last-child{border-bottom:none}
.lin b{font-family:var(--display);font-weight:400}
.fpick{display:flex;flex-wrap:wrap;gap:6px}
/* fun facts */
.ticker{background:#14213d;color:#eef2f8;border-radius:10px;padding:16px 20px 18px;display:grid;gap:8px;border-left:6px solid var(--accent)}
.ticker .eyebrow{color:#ffb08a;margin-right:6px}
.ticker .sub{color:#aeb9cc}
.ticker .owner{color:#aeb9cc}
.tk-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tk-label{font-family:var(--display);font-size:18px}
.tk-nav{margin-left:auto;display:flex;gap:6px}
.ticker .btn{border-color:#eef2f8;color:#eef2f8;padding:5px 11px;text-decoration:none}
.ticker .btn:hover{background:#eef2f8;color:#14213d}
.tk-body{margin:0;font-size:clamp(16px,2.2vw,19px);line-height:1.45;max-width:75ch;min-height:2.9em}
.ticker .fdot{outline:1px solid rgb(255 255 255 / .4)}
.factgrid{columns:3 300px;column-gap:16px}
.factcard{break-inside:avoid;margin:0 0 16px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.factcard p{margin:6px 0 0;font-size:16px;line-height:1.45}
.column p{max-width:68ch;font-size:16.5px;line-height:1.65;margin:10px 0 0}
.column p:first-child{margin-top:6px}
a.pill{text-decoration:none}
svg text{fill:var(--muted);font-family:var(--cond);font-size:11px}
@media (max-width:560px){th.hm,td.hm{display:none}.pad{padding:14px}.chips{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}

<script>

/* ---------- TRADE ROOM ---------- */

function tradeRoom() {

  const sw = x => { const w = A.toW(x); return (w > 0 ? '+' : w < 0 ? '−' : '') + n1(Math.abs(w)); };
  const col = x => x > 0.5 ? 'var(--win)' : x < -0.5 ? 'var(--loss)' : 'inherit';

  T.forEach(t => [t.f1, t.f2].forEach(f => {
    const o = owner(f, t.yi, t.d); const [mine, theirs, of] = side(t, f); const oo = owner(of, t.yi, t.d);
    const r = who[o] = who[o] || { o, f, yi: t.yi, n: 0, w: 0, l: 0, net: 0, best: null, worst: null, seasons: {}, vs: {} };

function wireTradeRoom() {

  });

        <p>One draft is too noisy to price a slot on its own, so each slot's value is the average of the picks around it. Early in the 1st round that means just a pick or two on either side. Later on the window widens, since a 3.07 and a 3.11 are close to interchangeable. The values are then forced to only go down as picks get later, so a lucky late hit never makes the 1.12 worth more than the 1.10. Startup drafts and drafts MFL never recorded are left out.</p>
        <p>How a pick counts in a trade depends on what happened to it. If the team that got the pick used it, the trade counts what that player actually scored for them, and the slot value acts only as a floor while a recent pick is still young. If the team traded the pick away again, it counts the value of the slot where it was eventually drafted, so a pick that became the 1.01 counts as a 1.01. Picks not drafted yet, and picks the data can't tie to a player, count the average for their round.</p>
        <p>The values are recalculated every Tuesday with the rest of the page, so they sharpen as more drafts play out.</p>
      </div></details></section>
    <section class="card pad"><h3>Pick buyers</h3><p class="sub">Future picks acquired in trades.</p><ol class="list">${Object.entries(acq).sort((a, b) => b[1] - a[1]).map(([f, c], i) => `<li><span><span class="rk">${i + 1}</span>${FS(+f)}</span><span class="v">${c}</span></li>`).join('')}</ol></section>

  </aside></div>`;
  $('#pmin').onchange = e => { pkstate.min = +e.target.value; viewPicks(); };

}

    <section class="card pad"><h3>Trade partners</h3><ol class="list">${partners.slice(0, 6).map(([k, c], i) => `<li><span><span class="rk">${i + 1}</span>${FS(k)}</span><span class="v">${c}</span></li>`).join('')}</ol>

/* ---------- RIVALRIES ---------- */
let rpair = null;
function viewRivalries() {
  let mx = '<table class="matrix"><thead><tr><th></th>' + Array.from({ length: 12 }, (_, i) => `<th style="vertical-align:bottom"><div class="colh">${esc(short(i + 1))}</div><div class="colbar" style="background:${fcol(i + 1)}"></div></th>`).join('') + '</tr></thead><tbody>';
  for (let a = 1; a <= 12; a++) {
    mx += `<tr><th class="rowh"><span class="fdot" style="--fcol:${fcol(a)}"></span>${esc(short(a))}</th>`;
    for (let b = 1; b <= 12; b++) {
      if (a === b) { mx += '<td><span class="mc self"></span></td>'; continue; }
      const h = A.h2h[a + '-' + b] || { w: 0, l: 0, t: 0 }; const n = h.w + h.l + h.t; const p = n ? (h.w + h.t / 2) / n : .5;
      const c = p >= .5 ? `color-mix(in oklab, var(--win) ${Math.round((p - .5) * 160)}%, var(--soft))` : `color-mix(in oklab, var(--loss) ${Math.round((.5 - p) * 160)}%, var(--soft))`;
      mx += `<td><button class="mc" data-rp="${a}-${b}" aria-pressed="${rpair === a + '-' + b}" style="background:${c}" title="${esc(owner(a))} vs ${esc(owner(b))}">${h.w}–${h.l}${h.t ? '–' + h.t : ''}</button></td>`;
    }
    mx += '</tr>';
  }
  mx += '</tbody></table>';
  // biggest rivalries
  const pairs = []; for (let a = 1; a <= 12; a++) for (let b = a + 1; b <= 12; b++) { const h = A.h2h[a + '-' + b]; if (h) pairs.push({ a, b, h, n: h.w + h.l + h.t, po: h.games.filter(g => g.kind === 'playoff').length }); }
  const lopsided = [...pairs].filter(p => p.n >= 6).sort((x, y) => Math.abs(y.h.w - y.h.l) - Math.abs(x.h.w - x.h.l)).slice(0, 6);
  const playoffRiv = [...pairs].filter(p => p.po).sort((x, y) => y.po - x.po).slice(0, 6);
  let detail = '<p class="sub">Tap any square to see every game between those two franchises.</p>';
  if (rpair) {
    const [a, b] = rpair.split('-').map(Number); const h = A.h2h[rpair];
    if (h) detail = `<h3>${esc(short(a))} vs ${esc(short(b))}</h3><p class="sub">${esc(owner(a))} is ${rec(h.w, h.l, h.t)} with ${n1(h.pf)} points for and ${n1(h.pa)} against.</p><div class="tbl"><table><thead><tr><th>Season</th><th>Week</th><th class="num">${esc(short(a))}</th><th class="num">${esc(short(b))}</th><th></th></tr></thead><tbody>${[...h.games].sort((x, y) => y.yi - x.yi || y.w - x.w).map(g => `<tr><td>${years[g.yi]}</td><td>${g.w}${g.kind === 'playoff' ? ' <span class="tag">Playoffs</span>' : ''}</td><td class="num">${n1(g.sx)}</td><td class="num">${n1(g.sy)}</td><td>${g.sx > g.sy ? '<span class="tag w">W</span>' : g.sx < g.sy ? '<span class="tag l">L</span>' : '<span class="tag">T</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  main.innerHTML = `<section><h2 class="sec">Rivalries</h2><p class="lede">Head-to-head records for every pairing, regular season plus championship bracket games. Read across a row: green means the row owner leads the series.</p></section>
  <div class="grid2"><section class="card pad"><div class="tbl">${mx}</div></section><section class="card pad" id="rdet">${detail}</section></div>
  <div class="grid2">
    <section class="card pad"><h3>Most one-sided series</h3><p class="sub">At least six meetings.</p><ol class="list">${lopsided.map((p, i) => { const lead = p.h.w >= p.h.l ? [p.a, p.b, p.h.w, p.h.l] : [p.b, p.a, p.h.l, p.h.w]; return `<li><span><span class="rk">${i + 1}</span>${FS(lead[0])} over ${FS(lead[1])}</span><span class="v">${lead[2]}–${lead[3]}</span></li>`; }).join('')}</ol></section>
    <section class="card pad"><h3>Playoff rivalries</h3><p class="sub">Pairs that keep meeting in the championship bracket.</p><ol class="list">${playoffRiv.map((p, i) => { const g = p.h.games.filter(x => x.kind === 'playoff'); const w = g.filter(x => x.sx > x.sy).length; return `<li><span><span class="rk">${i + 1}</span>${FS(p.a)} vs ${FS(p.b)} <span class="owner">${esc(short(p.a))} ${w}–${g.length - w}</span></span><span class="v">${p.po}</span></li>`; }).join('')}</ol></section>
  </div>`;
  main.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { rpair = b.dataset.rp; viewRivalries(); $('#rdet').scrollIntoView({ block: 'nearest' }); });
}

  <div class="grid3">
    ${box('Highest-scoring weeks', 'Team points in one week.', R.highWeek.map(x => tw(x, n1(x.s))).join(''))}
    ${box('Lowest-scoring weeks', 'Team points in one week.', R.lowWeek.map(x => tw(x, n1(x.s))).join(''))}
    ${box('Biggest blowouts', 'Margin of victory.', R.blowouts.map(x => `<li><span>${FS(x.f, x.yi)} over ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s - x.os)}</span></li>`).join(''))}
    ${box('Closest games', 'Margin of victory.', R.closest.map(x => `<li><span>${FS(x.f, x.yi)} over ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${(x.s - x.os).toFixed(2)}</span></li>`).join(''))}
    ${box('Toughest losses', 'Most points scored in a regular season loss.', R.unluckyLoss.map(x => `<li><span>${FS(x.f, x.yi)} lost to ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s)}</span></li>`).join(''))}
    ${box('Points left on the bench', 'Best possible lineup minus the lineup that played.', R.benchLeft.map(x => tw(x, n1(x.o - x.s))).join(''))}
    ${box('Best player weeks', 'Single-week points by a starter.', R.playerWeeks.slice(0, 12).map(x => `<li><span>${P(x.pid)}<br><span class="owner">${esc(short(x.f, x.yi))}, ${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s)}</span></li>`).join(''))}
    ${box('Most points in a season', 'Regular season points for.', R.seasonPF.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}, ${rec(x.w, x.l, x.t)}</span></span><span class="v">${n0(x.pf)}</span></li>`).join(''))}
    ${box('Best lineup setters', 'Season lineup efficiency.', R.seasonEff.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}</span></span><span class="v">${pct(x.eff)}</span></li>`).join(''))}
    ${box('Worst lineup setters', 'Season lineup efficiency.', R.worstEff.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}</span></span><span class="v">${pct(x.eff)}</span></li>`).join(''))}
    ${box('Boomerangs', 'Came back to a franchise that had let him go. Ranked by started points in the return stint.', A.boomerangs.slice(0, 12).map(b => `<li><span>${P(b.pid)}<br><span class="owner">${esc(short(b.f, b.back.sy))}, back in ${years[b.back.sy]}${b.away.length ? ' after ' + b.away.map(k => esc(short(k))).join(', ') : ''}</span></span><span class="v">${n0(b.back.pts)}</span></li>`).join(''))}
    ${box('Longest stints', 'Weeks on one roster without leaving.', A.longest.slice(0, 12).map(s => `<li><span>${P(s.pid)}<br><span class="owner">${esc(short(s.fid, s.sy))}, ${yr(s.sy)}–${s.ey == null ? 'now' : yr(s.ey)}</span></span><span class="v">${s.wks}</span></li>`).join(''))}
  </div>`;
}

/* ---------- FUN FACTS ---------- */
function buildFacts() {
  const F = [], add = (cat, html) => F.push({ cat, html });
  const fr = A.franchises;
  const wk = (yi, w) => `${years[yi]}, week ${w}`;
  // rivalries
  const pairs = []; for (let a = 1; a <= 12; a++) for (let b = a + 1; b <= 12; b++) { const h = A.h2h[a + '-' + b]; if (h) pairs.push({ a, b, h, n: h.w + h.l + h.t }); }
  pairs.filter(p => p.n >= 6).sort((x, y) => Math.abs(y.h.w - y.h.l) / y.n - Math.abs(x.h.w - x.h.l) / x.n).slice(0, 4).forEach(p => {
    const [W, Lo, w, l] = p.h.w >= p.h.l ? [p.a, p.b, p.h.w, p.h.l] : [p.b, p.a, p.h.l, p.h.w];
    const po = A.h2h[W + '-' + Lo].games.filter(g => g.kind === 'playoff'); const pw = po.filter(g => g.sx > g.sy).length;
    add('Rivalries', `${FA(W)} is <b>${w}–${l}</b> all-time against ${FA(Lo)}${po.length ? `, including ${pw}–${po.length - pw} in the playoffs` : ''}.`);
  });
  const even = pairs.filter(p => p.n >= 8).sort((x, y) => Math.abs(x.h.w - x.h.l) - Math.abs(y.h.w - y.h.l) || y.n - x.n)[0];
  if (even) add('Rivalries', `${FA(even.a)} and ${FA(even.b)} have met ${even.n} times and the series stands at <b>${even.h.w}–${even.h.l}</b>. Total points: ${n0(even.h.pf)} to ${n0(even.h.pa)}.`);
  // titles
  const byOwner = {}; A.champions.forEach(c => { if (!c.champ) return; const o = owner(c.champ, c.yi); (byOwner[o] = byOwner[o] || { f: c.champ, yi: c.yi, t: [] }).t.push(c.y); });
  const topT = Object.values(byOwner).sort((a, b) => b.t.length - a.t.length)[0];
  if (topT) { const t = topT.t; const b2b = t.some((y, i) => t[i + 1] === y + 1); add('Champions', `${FN(topT.f, topT.yi)} has won <b>${t.length} ${t.length === 1 ? 'title' : 'titles'}</b> (${t.join(', ')})${b2b ? ', including back-to-back championships' : ''}.`); }
  const noRing = fr.filter(s => !s.titles.length && s.w + s.l).sort((a, b) => b.w / (b.w + b.l) - a.w / (a.w + a.l))[0];
  if (noRing) add('Champions', `${FA(noRing.f)} owns the best regular season record of anyone without a title: <b>${rec(noRing.w, noRing.l, noRing.t)}</b>.`);
  const poBest = [...fr].sort((a, b) => b.pw - a.pw)[0]; add('Champions', `${FA(poBest.f)} has the most championship-bracket wins with <b>${poBest.pw}</b>.`);
  const poApp = fr.filter(s => !s.titles.length).sort((a, b) => b.playoffs - a.playoffs)[0]; if (poApp && poApp.playoffs) add('Champions', `${FA(poApp.f)} has made the playoffs <b>${poApp.playoffs} times</b> without winning it all.`);
  const byRunner = {}; A.champions.forEach(c => { if (!c.runner) return; const o = owner(c.runner, c.yi); (byRunner[o] = byRunner[o] || { f: c.runner, yi: c.yi, t: [] }).t.push(c.y); });
  const topR = Object.values(byRunner).sort((a, b) => b.t.length - a.t.length)[0]; if (topR && topR.t.length > 1) add('Champions', `${FN(topR.f, topR.yi)} has lost in the title game <b>${topR.t.length} times</b> (${topR.t.join(', ')}).`);
  // games
  const R = A.records;
  const ul = R.unluckyLoss[0]; if (ul) add('Weekly', `${FN(ul.f, ul.yi)} scored <b>${n1(ul.s)}</b> in ${wk(ul.yi, ul.w)} and still lost to ${FN(ul.opp, ul.yi)}.`);
  const tw = []; A.games.forEach(g => { tw.push({ f: g.a, s: g.sa, opp: g.b, os: g.sb, yi: g.yi, w: g.w, reg: g.reg }); tw.push({ f: g.b, s: g.sb, opp: g.a, os: g.sa, yi: g.yi, w: g.w, reg: g.reg }); });
  const lowWin = tw.filter(x => x.s > x.os && x.reg && x.s > 0).sort((a, b) => a.s - b.s)[0]; if (lowWin) add('Weekly', `${FN(lowWin.f, lowWin.yi)} won a game in ${wk(lowWin.yi, lowWin.w)} with only <b>${n1(lowWin.s)}</b> points.`);
  const bl = R.blowouts[0]; add('Weekly', `The biggest blowout on record: ${FN(bl.f, bl.yi)} beat ${FN(bl.opp, bl.yi)} by <b>${n1(bl.s - bl.os)}</b> in ${wk(bl.yi, bl.w)}.`);
  const cl = R.closest[0]; add('Weekly', `The closest game ever: ${FN(cl.f, cl.yi)} edged ${FN(cl.opp, cl.yi)} by <b>${(cl.s - cl.os).toFixed(2)}</b> points in ${wk(cl.yi, cl.w)}.`);
  const bn = R.benchLeft[0]; add('Lineups', `${FN(bn.f, bn.yi)} left <b>${n1(bn.o - bn.s)} points</b> on the bench in ${wk(bn.yi, bn.w)}.`);
  const hw = R.highWeek[0]; add('Weekly', `The highest score in league history is <b>${n1(hw.s)}</b>, by ${FN(hw.f, hw.yi)} in ${wk(hw.yi, hw.w)}.`);
  const pwk = R.playerWeeks[0]; if (pwk) add('Players', `${P(pwk.pid)} put up <b>${n1(pwk.s)} points</b> in one week for ${FN(pwk.f, pwk.yi)} (${wk(pwk.yi, pwk.w)}), the best starter week on record.`);
  const se = R.seasonEff[0]; add('Lineups', `${FN(se.f, se.yi)} set lineups at <b>${pct(se.eff)}</b> of the best possible score in ${years[se.yi]}, the sharpest season on record.`);
  const sp = R.seasonPF[0]; add('Weekly', `${FN(sp.f, sp.yi)} scored <b>${n0(sp.pf)}</b> regular season points in ${years[sp.yi]}, the most ever.`);
  // players
  const tv = travel[0]; add('Players', `${P(tv[0].id)} has been rostered by <b>${tv[1]} of the 12 franchises</b> across ${tv[2]} separate stints.`);
  const tradedMost = A.allP.map(p => [p, S(p).filter(s => s.how.k === 'T').length]).sort((a, b) => b[1] - a[1])[0];
  add('Players', `${P(tradedMost[0])} has been traded <b>${tradedMost[1]} times</b>, more than any other player.`);
  // ping-pong: same player traded between the same two franchises 3+ times
  const pong = []; A.allP.forEach(p => { const c = {}; S(p).filter(s => s.how.k === 'T').forEach(s => { const k = Math.min(s.fid, s.how.from) + '-' + Math.max(s.fid, s.how.from); c[k] = (c[k] || 0) + 1; }); Object.entries(c).forEach(([k, n]) => n >= 3 && pong.push([p, k, n])); });
  pong.sort((a, b) => b[2] - a[2]).slice(0, 2).forEach(([p, k, n]) => { const [a, b] = k.split('-').map(Number); add('Trades', `${P(p)} was traded between ${FA(a)} and ${FA(b)} <b>${n} times</b>.`); });
  const lg = A.longest[0]; add('Players', `${P(lg.pid)} has spent <b>${lg.wks} weeks</b> on ${lg.ey == null ? FA(lg.fid) : FN(lg.fid, lg.sy)}'s roster without ever leaving${lg.ey == null ? ', and he is still there' : ''}.`);
  const leg = A.legends.map(x => ({ f: x.f, ...x.top[0] })).filter(x => x.pid).sort((a, b) => b.pts - a.pts)[0]; add('Players', `${P(leg.pid)} has scored <b>${n0(leg.pts)} started points</b> for ${FA(leg.f)}, the most any player has given one franchise.`);
  const bm = {}; A.boomerangs.forEach(b => { const k = b.pid + '|' + b.f; bm[k] = (bm[k] || 1) + 1; }); const bmTop = Object.entries(bm).sort((a, b) => b[1] - a[1])[0];
  if (bmTop) { const [p, f] = bmTop[0].split('|'); add('Players', `${P(p)} has had <b>${bmTop[1]} separate stints</b> with ${FA(+f)}.`); }
  // waivers
  const bb = A.bigBids[0]; if (bb) { const out = bb.end && bb.end.k === 'T' && bb.ed - bb.sd <= 3 ? `then traded him away ${bb.ed - bb.sd <= 1 ? 'the next day' : 'within days'}` : `and got ${n0(bb.pts)} started points from him`; add('Waiver Wire', `${FN(bb.fid, bb.sy)} spent a record <b>${money(A.bid(bb))}</b> to claim ${P(bb.pid)} in ${yr(bb.sy)}, ${out}.`); }
  const free = A.bestPickups.find(s => A.bid(s) === 0); if (free) add('Waiver Wire', `${P(free.pid)} cost ${FN(free.fid, free.sy)} nothing in ${yr(free.sy)} and returned <b>${n0(free.pts)} started points</b>.`);
  const bt = A.bidTrend.filter(b => b.n); if (bt.length > 1) add('Waiver Wire', `The average winning bid went from <b>${money(bt[0].avg.toFixed(2))}</b> in ${bt[0].y} to <b>${money(bt[bt.length - 1].avg.toFixed(2))}</b> in ${bt[bt.length - 1].y}.`);
  const tot = []; for (let f = 1; f <= 12; f++) tot.push([f, years.reduce((a, _, k) => a + A.faab[k][f].spent, 0)]); tot.sort((a, b) => b[1] - a[1]);
  add('Waiver Wire', `${FA(tot[0][0])} has spent <b>$${n0(tot[0][1])}</b> in FAAB all-time, the most in the league. ${FA(tot[11][0])} has spent the least at $${n0(tot[11][1])}.`);
  const hr = [...A.hitRate].filter(h => h.n >= 30).sort((a, b) => b.rate - a.rate)[0]; if (hr) add('Waiver Wire', `${pct(hr.rate)} of ${FA(hr.f)}'s pickups turned into ${A.HIT}+ game starters, the best hit rate in the league.`);
  const busy = [...A.hitRate].sort((a, b) => b.n - a.n)[0]; add('Waiver Wire', `${FA(busy.f)} has made <b>${busy.n} pickups</b> since ${years[0]}, the most in the league.`);
  // trades
  const pr = Object.entries(A.partner).sort((a, b) => b[1] - a[1])[0]; const [pa, pb] = pr[0].split('-').map(Number); add('Trades', `${FA(pa)} and ${FA(pb)} have made <b>${pr[1]} trades</b> with each other, the most of any pair.`);
  const never = []; for (let a = 1; a <= 12; a++) for (let b = a + 1; b <= 12; b++) if (!A.partner[a + '-' + b]) never.push([a, b]);
  if (never.length) add('Trades', `<b>${never.length}</b> ${never.length === 1 ? 'pair of owners has' : 'pairs of owners have'} never made a trade with each other, including ${FA(never[0][0])} and ${FA(never[0][1])}.`);
  const trec = []; for (let f = 1; f <= 12; f++) { const ts = A.trades.filter(t => (t.f1 === f || t.f2 === f) && !t.open && (t.p1 + t.p2) > 0); trec.push([f, ts.filter(t => t.winner === f).length, ts.filter(t => t.winner && t.winner !== f).length]); }
  trec.sort((a, b) => (b[1] - b[2]) - (a[1] - a[2]));
  add('Trades', `By points received, ${FA(trec[0][0])} has the best trade record in the league at <b>${trec[0][1]}–${trec[0][2]}</b>. ${FA(trec[11][0])} is ${trec[11][1]}–${trec[11][2]}.`);
  const busiestSeason = []; years.forEach((y, yi) => { for (let f = 1; f <= 12; f++) busiestSeason.push([f, yi, A.faab[yi][f].trades]); }); busiestSeason.sort((a, b) => b[2] - a[2]);

}

/* ---------- routing ---------- */
const TABS = ['overview', 'week', 'facts', 'players', 'trades', 'picks', 'future', 'waivers', 'franchises', 'rivalries', 'records', 'crossover'];
if (!raw.cross) TABS.splice(TABS.indexOf('crossover'), 1);
if (!raw.sched) TABS.splice(TABS.indexOf('week'), 1);
// six top-level groups; the ones with several pages get a row of sub-tabs
const ICON = {
  week: '<path d="M4 6.5h16v13H4z M4 10.5h16 M8.5 4v4 M15.5 4v4" />',
  league: '<path d="M7 4h10v4a5 5 0 0 1-10 0z M7 6H4.5a2.5 2.5 0 0 0 2.6 3.6 M17 6h2.5a2.5 2.5 0 0 1-2.6 3.6 M12 13v3.5 M8.5 20h7 M9.5 16.5h5V20h-5z" />',
  players: '<circle cx="12" cy="8.5" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0" />',
  deals: '<path d="M4 8h13l-3.5-3.5 M20 16H7l3.5 3.5" />',
  future: '<path d="M4 18 10 12l3.5 3.5L20 8.5 M15 8.5h5v5" />',
  draft: '<path d="M8 4h8v2.5H8z M6 5.5H4.5v15h15v-15H18 M8 11h8 M8 14.5h8 M8 18h5" />',
  crossover: '<circle cx="9" cy="12" r="5"/><circle cx="15" cy="12" r="5"/>',
};
const SUBL = { overview: 'Overview', franchises: 'Franchises', rivalries: 'Rivalries', records: 'Records', facts: 'Fun Facts', trades: 'Trades', picks: 'Draft', waivers: 'Waiver Wire' };
const GROUPS = [
  { k: 'week', label: 'This Week', short: 'Week', tabs: ['week'] },
  { k: 'league', label: 'League', tabs: ['overview', 'franchises', 'rivalries', 'records', 'facts'] },
  { k: 'players', label: 'Players', tabs: ['players'] },
  { k: 'deals', label: 'Deals', tabs: ['trades', 'waivers'] },
  { k: 'draft', label: 'Draft', tabs: ['picks'] },
  { k: 'future', label: 'Future', tabs: ['future'] },
  { k: 'crossover', label: 'Crossover', short: 'Cross', tabs: ['crossover'] },
].map(g => ({ ...g, tabs: g.tabs.filter(t => TABS.includes(t)) })).filter(g => g.tabs.length);
const groupOf = t => GROUPS.find(g => g.tabs.includes(t)) || GROUPS[0];
const lastSub = {};
const navEl = document.getElementById('tabs');
const isPhone = () => matchMedia('(max-width: 720px)').matches;
const drawNav = () => {
  navEl.style.setProperty('--ntabs', GROUPS.length);
  navEl.innerHTML = GROUPS.map(g => `<a href="#${g.tabs[0]}" data-g="${g.k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[g.k]}</svg><span>${isPhone() && g.short ? g.short : g.label}</span></a>`).join('');
  navEl.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); const g = GROUPS.find(x => x.k === a.dataset.g); const t = lastSub[g.k] || g.tabs[0]; go(t); });
};
drawNav();
// open on This Week while a season is being played, otherwise on the Overview
const defaultTab = () => {
  if (!TABS.includes('week')) return 'overview';
  const k1 = raw.k1 && raw.k1[years[last]]; const W = Math.max(0, ...A.games.filter(g => g.yi === last).map(g => g.w));
  if (!k1 || !W) return 'overview';
  const lastGame = Date.UTC(2018, 0, 1) + (k1 + 7 * (W - 1) + 5) * 86400000;
  return Date.now() - lastGame < 16 * 86400000 ? 'week' : 'overview';
};
// sticky offsets: desktop header stays pinned; on phones it scrolls away and only the sub-tabs pin
function layout() {
  const band = document.querySelector('.band'), sub = document.getElementById('subnav');
  const bandH = isPhone() ? 0 : band.offsetHeight; const subH = sub.hidden ? 0 : sub.offsetHeight;
  const root = document.documentElement.style;
  root.setProperty('--subTop', bandH + 'px'); root.setProperty('--jumpTop', (bandH + subH) + 'px');
  const j = main.querySelector('.pills.jump'); root.setProperty('--scrollPad', (bandH + subH + (j ? j.offsetHeight : 0) + 12) + 'px');
}
let phoneWas = isPhone();
addEventListener('resize', () => { if (isPhone() !== phoneWas) { phoneWas = isPhone(); drawNav(); route(true); } else layout(); });
function route(keepScroll) {
  const h = (location.hash || '').slice(1) || defaultTab();
  let tab = h, arg = null;
  if (/^p\d+$/.test(h)) { tab = 'players'; arg = h.slice(1); if (!raw.pl[arg]) arg = null; }
  else if (/^t\d+$/.test(h)) { tab = 'trades'; arg = +h.slice(1); if (!A.trades[arg]) arg = null; }
  else if (/^f\d+$/.test(h)) { tab = 'franchises'; arg = +h.slice(1); if (arg < 1 || arg > 12) arg = null; }
  if (!TABS.includes(tab)) tab = defaultTab();
  const g = groupOf(tab); lastSub[g.k] = tab;
  navEl.querySelectorAll('a').forEach(a => a.setAttribute('aria-current', a.dataset.g === g.k ? 'page' : 'false'));
  const sub = document.getElementById('subnav');
  sub.hidden = g.tabs.length < 2;
  document.getElementById('subin').innerHTML = g.tabs.map(t => `<a href="#${t}" aria-current="${t === tab ? 'page' : 'false'}">${SUBL[t] || t}</a>`).join('');
  document.body.dataset.tab = tab;
  clearInterval(tickTimer);
  ({ overview: viewOverview, week: viewWeek, facts: viewFacts, players: () => viewPlayers(arg), trades: () => viewTrades(arg), picks: viewPicks, future: viewFuture, waivers: viewWaivers, franchises: () => viewFranchises(arg), rivalries: viewRivalries, records: viewRecords, crossover: viewCross })[tab]();
  const cur = sub.querySelector('a[aria-current="page"]'); if (cur && !sub.hidden) cur.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  layout();
}
// search: an icon on phones that opens the search box
{ const sb = document.getElementById('sbtn'), band = document.querySelector('.band');
  if (sb) sb.onclick = () => { const on = !band.classList.contains('searching'); band.classList.toggle('searching', on); sb.setAttribute('aria-expanded', on); if (on) { const qi = document.getElementById('q'); qi && qi.focus(); } }; }
function go(h) { const bd = document.querySelector('.band'); if (bd) bd.classList.remove('searching'); if (location.hash === '#' + h) route(); else location.hash = h; window.scrollTo(0, 0); }
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
document.addEventListener('click', e => {
  const p = e.target.closest('[data-p]'); if (p && !p.closest('.sugg')) { e.preventDefault(); go('p' + p.dataset.p); return; }
  const t = e.target.closest('[data-t]'); if (t) { e.preventDefault(); tstate.yi = ''; tstate.f = ''; tstate.n = 25; go('t' + t.dataset.t); return; }
  const f = e.target.closest('[data-f]'); if (f) { e.preventDefault(); go('f' + f.dataset.f); }
});

/* ---------- search ---------- */
const q = $('#q'), ul = $('#sugg'), combo = $('#combo');
let hits = [], sel = -1;
function draw() { ul.hidden = !hits.length; ul.innerHTML = hits.map((h, i) => `<li role="option" aria-selected="${i === sel}" data-p="${h.id}"><span>${esc(h.n)}</span><small>${esc(h.pos)} · ${esc(h.nfl)}</small></li>`).join(''); }
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase(); sel = -1;
  if (t.length < 2) { hits = []; return draw(); }
  const words = t.split(/\s+/);
  hits = index.filter(x => words.every(w => x.k.includes(w))).sort((a, b) => (b.k.startsWith(t) - a.k.startsWith(t)) || (S(b.id).length - S(a.id).length)).slice(0, 12);
  draw();
});
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && hits.length) { sel = (sel + 1) % hits.length; draw(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' && hits.length) { sel = (sel - 1 + hits.length) % hits.length; draw(); e.preventDefault(); }
  else if (e.key === 'Enter') { const h = hits[sel < 0 ? 0 : sel]; if (h) pick(h.id); }
  else if (e.key === 'Escape') { hits = []; draw(); }
});
function pick(id) { hits = []; draw(); q.value = ''; q.blur(); go('p' + id); }
ul.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) { e.preventDefault(); pick(li.dataset.p); } });
document.addEventListener('click', e => { if (!combo.contains(e.target)) { hits = []; draw(); } });

route();
})();

</script>
