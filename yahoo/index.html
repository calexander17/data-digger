<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Yahoo approval code</title>
<style>
:root{--bg:#f4f1ea;--fg:#1b1b1f;--muted:#5c5a55;--card:#fff;--accent:#6001d2;--rule:#ddd8cc}
@media (prefers-color-scheme:dark){:root{--bg:#141318;--fg:#ece9e2;--muted:#a6a29a;--card:#1f1d24;--accent:#b583ff;--rule:#37333d}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:32px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto}h1{font-size:24px;margin:0 0 8px}p{color:var(--muted)}
.code{background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:16px;font:600 20px/1.4 ui-monospace,Menlo,monospace;word-break:break-all;margin:18px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:600 16px system-ui;cursor:pointer}
</style></head><body><main>
<h1 id="h">Yahoo approval code</h1>
<p id="p">Copy this code and send it to Caleb. It lets the Data Digger site read your league; it is not your password.</p>
<div class="code" id="c"></div>
<button id="b" type="button">Copy code</button>
<p style="margin-top:22px;font-size:14px">This page only shows the code on your screen. It doesn't send it anywhere. You can remove the app's access any time in your Yahoo account settings.</p>
</main>
<script>
const q=new URLSearchParams(location.search);const code=q.get('code');const err=q.get('error');
const c=document.getElementById('c'),b=document.getElementById('b');
if(code){c.textContent=code;}else{document.getElementById('h').textContent=err?'Yahoo did not approve':'No code here yet';document.getElementById('p').textContent=err?('Yahoo said: '+(q.get('error_description')||err)+'. Try the approval link again.'):'Open the approval link Caleb sent you, sign in to Yahoo and click Agree. You will land back here with a code.';c.hidden=true;b.hidden=true;}
b.onclick=()=>{navigator.clipboard.writeText(code).then(()=>{b.textContent='Copied'},()=>{const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selected, now copy'});};
</script></body></html>
