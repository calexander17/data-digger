<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Flex Luger Data Digger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" type="image/png" href="favicon.png"><link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flex Luger"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a2f4d"><meta name="robots" content="noindex">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Graduate&family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: navy masthead with varsity lettering and tab rail; each tab is a "back of the trading card" ledger on card stock */
:root{
  --bg:#e9edf2; --card:#f8fafc; --ink:#14213d; --muted:#5a6680; --rule:#cfd6e1; --soft:#dfe5ed;
  --accent:#d9531e; --accent-ink:#ffffff; --hl:#fde3d6; --win:#1f8a5b; --loss:#c23b3b; --gold:#b8860b;
  --fl:0.62; --fc:0.13;
  --display:"Graduate","Rockwell","Georgia",serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Semi Condensed","Barlow","Arial Narrow",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1424; --card:#151f35; --ink:#e6ebf4; --muted:#93a0b8; --rule:#27344f; --soft:#1c2842;
  --accent:#ff8650; --accent-ink:#1a0d06; --hl:#3a2418; --win:#4cc28d; --loss:#ff7a7a; --gold:#e8b84a; --fl:0.72; --fc:0.12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1424; --card:#151f35; --ink:#e6ebf4; --muted:#93a0b8; --rule:#27344f; --soft:#1c2842;
  --accent:#ff8650; --accent-ink:#1a0d06; --hl:#3a2418; --win:#4cc28d; --loss:#ff7a7a; --gold:#e8b84a; --fl:0.72; --fc:0.12; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#14213d}
.band{background:#14213d;color:#eef2f8;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 0 var(--accent)}
.in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:12px 6px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(19px,3vw,26px);margin:0;letter-spacing:.02em;line-height:1.1}
.brand span{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.search{position:relative;flex:1 1 260px;max-width:400px}
.search input{width:100%;box-sizing:border-box;font:600 15px var(--body);padding:9px 12px;border-radius:6px;border:2px solid transparent;background:#f8fafc;color:#14213d}
.search input:focus{outline:none;border-color:var(--accent)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);color:var(--ink);border:1px solid var(--rule);border-radius:6px;box-shadow:0 10px 30px rgb(0 0 0 / .25);max-height:340px;overflow:auto;margin:0;padding:4px;list-style:none;z-index:6}
.sugg li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:4px;cursor:pointer}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--hl)}
.sugg small{font-family:var(--cond);color:var(--muted);white-space:nowrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;color:#c9d3e3;text-decoration:none;font:600 14px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px 10px;border-radius:6px 6px 0 0}
nav.tabs a:hover{color:#fff;background:rgb(255 255 255 / .06)}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink)}
main{padding-block:24px 56px;display:grid;gap:24px}
h2.sec{font-family:var(--display);font-weight:400;font-size:clamp(22px,3vw,30px);margin:0;line-height:1.15;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:19px;margin:0 0 2px;line-height:1.2}
.lede{color:var(--muted);margin:4px 0 0;max-width:68ch}
.sub{font-size:13px;color:var(--muted)}
.eyebrow{font:600 12px var(--cond);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--rule);border-radius:10px;min-width:0}
.pad{padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:none}
.num{text-align:right;white-space:nowrap}
th.num{text-align:right}
.fdot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--fcol);margin-right:7px;vertical-align:0}
.team{font-weight:700}
.owner{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font:700 11px var(--cond);letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;background:var(--hl);color:var(--ink);white-space:nowrap}
.tag.cur{background:var(--accent);color:var(--accent-ink)}
.tag.gold{background:var(--gold);color:#fff}
.tag.w{background:var(--win);color:#fff}.tag.l{background:var(--loss);color:#fff}
.plink,.flink,.tlink{color:inherit;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:2px;cursor:pointer;background:none;border:none;font:inherit;padding:0;text-align:left}
.plink:hover,.flink:hover,.tlink:hover{text-decoration-color:var(--accent)}
.self{font-weight:700;text-decoration:none;cursor:default}
:is(a,button,summary,select,input):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.controls label{display:grid;gap:3px;font:600 12px var(--cond);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{font:500 14px var(--body);padding:7px 10px;border-radius:6px;border:1px solid var(--rule);background:var(--card);color:var(--ink)}
.btn{font:600 13px var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;border-radius:6px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.on{background:var(--ink);color:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font:600 13px var(--cond);padding:6px 10px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.list li:last-child{border-bottom:none}
.list .v{font-family:var(--display);white-space:nowrap;font-variant-numeric:tabular-nums}
.rk{font:700 12px var(--cond);color:var(--muted);width:22px;flex:none}
.big{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.lk-bars{display:grid;gap:8px;margin-top:10px}
.lk-row{display:grid;grid-template-columns:minmax(0,9em) 1fr 3.2em;grid-template-areas:"n t v" ". s s";column-gap:10px;align-items:center}
.lk-name{grid-area:n;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lk-track{grid-area:t;position:relative;height:12px;background:var(--soft);border-radius:6px}
.lk-mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--rule)}.lk-bar{position:absolute;top:0;bottom:0;border-radius:6px}
.lk-val{grid-area:v;text-align:right;font-variant-numeric:tabular-nums}.lk-sub{grid-area:s;font-size:12px}
.lk-grid td.lk-cell{text-align:center;cursor:pointer;padding:4px 2px;min-width:34px;line-height:1.1;border:2px solid transparent}.lk-grid td.lk-cell b{display:block;font-size:12px}.lk-grid td.lk-cell span{font-size:11px;opacity:.85}
.lk-grid td.lk-cell.on{border-color:var(--ink)}.lk-how summary{cursor:pointer}.lk-how p{max-width:68ch;margin:10px 0 0}
.dr-track{display:inline-block;vertical-align:middle;position:relative;width:90px;height:10px;background:var(--soft);border-radius:5px;margin-right:6px}.dr-mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--rule)}.dr-bar{position:absolute;top:0;bottom:0;border-radius:5px}
.dr-g td.dr-cell{text-align:center;cursor:pointer;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:6px 4px;border:2px solid transparent}.dr-g td.dr-cell.on{border-color:var(--ink)}
.dr-prow{display:grid;grid-template-columns:minmax(0,8em) 1fr;gap:10px;align-items:center}.dr-prow>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-pos{display:flex;height:18px;border-radius:5px;overflow:hidden;background:var(--soft)}.dr-pos i{display:block;height:100%;color:#fff;font-size:10px;font-style:normal;font-weight:700;text-align:center;line-height:18px}
.dr-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:6px}.dr-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.fc-rk{line-height:1.1;min-width:44px}.fc-rk b{display:block;font-size:15px}.fc-rk span{font-size:11px;opacity:.8}
.fc-pks{display:flex;flex-wrap:wrap;gap:4px}.fc-pk{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:34px;padding:2px 5px;border-radius:5px;border:1.5px solid var(--rule);font:700 11px var(--cond);line-height:1.1}.fc-pk.in{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.fc-pk small{font-size:9px;font-weight:600;opacity:.9}
/* ---- navigation: grouped tabs, sub-tabs, sticky section shortcuts, phone bottom bar ---- */
html{scroll-padding-top:var(--scrollPad,120px)}
nav.tabs a{display:inline-flex;align-items:center;gap:7px}
nav.tabs a svg{width:16px;height:16px;flex:none;opacity:.85}
.sbtn .ic-x{display:none}
.sbtn{display:none;background:none;border:0;color:#eef2f8;padding:8px;margin:-8px -6px -8px 0;border-radius:8px;cursor:pointer}
.subnav{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--subTop,0px));z-index:4;background:var(--bg);border-bottom:1px solid var(--rule)}
.subin{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:10px}
.subin::-webkit-scrollbar{display:none}
.subin a{flex:none;font:600 14px var(--cond);letter-spacing:.04em;padding:7px 14px;border-radius:999px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);text-decoration:none;white-space:nowrap}
.subin a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pills.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--jumpTop,0px));z-index:3;background:var(--bg);flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-block:-14px;padding-block:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.pills.jump::-webkit-scrollbar{display:none}
.pills.jump .pill{flex:none;white-space:nowrap}
@media (max-width:720px){
  .band{position:relative;top:0}
  .top{padding-block:10px 10px;flex-wrap:nowrap;gap:10px}
  .brand{flex:1 1 0;min-width:0}
  .sbtn{flex:none}
  .band.searching .sbtn .ic-x{display:block}.band.searching .sbtn .ic-s{display:none}
  .brand h1{font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sbtn{display:block}
  .search{display:none;flex-basis:100%;max-width:none}
  .band.searching .top{flex-wrap:wrap}
  .band.searching .search{display:block}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(var(--ntabs,6),minmax(0,1fr));gap:0;background:#14213d;border-top:2px solid var(--accent);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgb(0 0 0 / .18);overflow:visible}
  nav.tabs a{flex-direction:column;gap:3px;justify-content:center;font-size:10px;letter-spacing:.02em;padding:8px 1px 7px;border-radius:0;min-height:54px;text-align:center;white-space:nowrap;overflow:hidden}
  nav.tabs a span{overflow:hidden;text-overflow:ellipsis;max-width:100%}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]{background:transparent;color:#ff9a6c}
  nav.tabs a[aria-current="page"] svg{opacity:1}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:380px){
  nav.tabs a{font-size:9px;letter-spacing:0;padding-inline:0}
  nav.tabs a svg{width:20px;height:20px}
  .subin{padding-block:8px}
  .subin a{font-size:13.5px;padding:6px 12px}
  h2.sec{font-size:24px}
  .pad{padding:14px}
  td,th{padding:8px 9px}
}
.rk{display:inline-block}
.onlym{display:none}
select{max-width:100%}
.controls label{min-width:0;max-width:100%;grid-template-columns:minmax(0,1fr)}
.tbl td .flink,.tbl td .plink{white-space:nowrap}
.tbl td:has(> .fdot){white-space:nowrap}
@media (max-width:720px){
  .tbl td .flink.team{display:inline-block;max-width:10.5em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
  .tbl td .owner{white-space:nowrap}
  .tbl th{font-size:11px;letter-spacing:.06em}
  .xt{display:none}
  .split>aside{order:2}
  .fc-cap table{min-width:720px}.fc-cap .fc-pks{min-width:8.6em}
  body[data-tab="trades"] main>.tr-side{order:5}
  .fc-cap td:first-child,.fc-cap th:first-child{position:sticky;left:0;background:var(--card);z-index:1}
  .lede{font-size:14.5px}
  .facts{grid-template-columns:1fr}
}
@media (max-width:560px){
  .onlym{display:block}
  .hm-i{display:none}
  .onlyg{display:grid;gap:2px}
  table.ledger thead{display:none}
  table.ledger,table.ledger tbody{display:block}
  table.ledger tr{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;column-gap:10px;padding:12px 14px;border-bottom:1px solid var(--rule);border-left:6px solid var(--fcol)}
  table.ledger td{border:0;padding:0}
  table.ledger td.yr{border-left:0;width:auto;font-size:15px}
  table.ledger td.hm{display:none}
  table.ledger td:last-child{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px dashed var(--rule);display:grid;grid-template-columns:1fr 1fr;gap:12px}
}
.tr-cal{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:170px;margin-top:12px}
.tr-m{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font:600 11px var(--cond);color:var(--muted)}
.tr-m i{display:block;width:100%;max-width:34px;background:color-mix(in srgb, var(--accent) 45%, var(--soft));border-radius:4px 4px 0 0}
.tr-m .num{color:var(--ink)}
.mc[data-fx][aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.hx{display:grid;gap:3px;margin-top:6px;font-size:13.5px;line-height:1.4}.hx .eyebrow{margin-right:4px;font-size:10.5px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
.fact{padding:14px 16px;border-left:4px solid var(--accent);background:var(--card);border-radius:0 8px 8px 0}
.fact .sub{margin-top:6px}
/* champions */
.champs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:12px}
.champ{border-radius:10px;padding:14px 14px 12px;background:var(--card);border:1px solid var(--rule);border-top:6px solid var(--fcol);display:grid;gap:6px;align-content:start}
.champ .yr{font-family:var(--display);font-size:24px;line-height:1}
.champ .nm{font-weight:700;line-height:1.25}
/* ledger */
.phead{padding:20px 22px 16px;display:grid;gap:12px;border-bottom:3px solid var(--ink)}
.pname{font-family:var(--display);font-size:clamp(28px,5vw,42px);line-height:1.05;margin:0;text-wrap:balance;font-weight:400}
.stats{display:flex;flex-wrap:wrap;gap:6px 22px;font-family:var(--cond);font-size:15px;color:var(--muted)}
.stats b{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.chips{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.chip{height:24px;border-radius:3px;border:1.5px dashed var(--rule);display:grid;place-items:center;font:700 11px var(--cond);color:var(--muted)}
.chip.on{border:none;background:var(--fcol);color:#fff;text-shadow:0 1px 1px rgb(0 0 0 / .35)}
td.yr{font-family:var(--display);font-size:16px;white-space:nowrap;border-left:6px solid var(--fcol);width:1%}
.how{font-weight:600}
.when{font-size:13px;color:var(--muted)}
details>summary{cursor:pointer;font:600 13px var(--cond);color:var(--accent);letter-spacing:.03em}
.deal{display:grid;gap:8px;margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:13px}
.deal ul{margin:2px 0 0;padding-left:18px}
.note{font-size:13px;color:var(--muted);margin:0}
/* trades */
.trade{display:grid;gap:12px;padding:16px 18px}
.trade+.trade{border-top:1px solid var(--rule)}
.tsides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:620px){.tsides{grid-template-columns:1fr}}
.side{border-left:5px solid var(--fcol);padding:2px 0 2px 12px;min-width:0}
.side ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:3px;font-size:14px}
.side li{display:flex;justify-content:space-between;gap:10px}
.side li .p{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
.side .tot{font-family:var(--display);font-size:20px}
.pv-card{display:grid;gap:10px;min-width:0}
.pv-big{border:2px solid var(--accent)}
.pv-side{display:grid;gap:4px}
.pv-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0}
.pv-name{min-width:0;overflow-wrap:anywhere}
.pv-proj{font-size:20px}
.pv-big .pv-proj{font-size:26px}
.pv-form{display:inline-flex;gap:3px}
.pv-form i{font-style:normal;font-size:11px;font-weight:700;width:18px;height:18px;border-radius:4px;display:inline-grid;place-items:center;color:#fff;background:var(--muted)}
.pv-form i.w{background:var(--win)}.pv-form i.l{background:var(--loss)}
.pv-stakes,.pv-hot{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.pv-stakes>div,.pv-hot>div{display:grid;gap:2px;min-width:0;font-size:14px}
.pv-notes{margin:10px 0 0;padding-left:18px;display:grid;gap:8px;font-size:15px;line-height:1.5}
.pv-upset{border-left:4px solid var(--loss)}
.pv-upset h3{margin-top:4px}
.verdict{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}
.verdict span{background:var(--fcol)}
.tmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;color:var(--muted)}
.tree{margin:6px 0 0 6px;padding-left:14px;border-left:2px dashed var(--rule);display:grid;gap:8px;font-size:13px}
.tree .node{display:grid;gap:2px}
/* matrix */
.matrix{border-collapse:separate;border-spacing:2px;width:auto;margin:0 auto}
.matrix th{padding:4px;font-size:11px;text-align:center;border:none}
.matrix th.rowh{text-align:right;white-space:nowrap;padding-right:6px}
.matrix td{border:none;padding:0}
.mc{width:46px;height:38px;border-radius:4px;display:grid;place-items:center;font:600 12px var(--cond);color:var(--ink);background:var(--soft);cursor:pointer;border:none;line-height:1.05;font-variant-numeric:tabular-nums}
.mc small{font-size:10px;opacity:.75;font-weight:500}
.mc.self{background:transparent;cursor:default}
.mc[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.colh{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;height:96px;margin:0 auto;line-height:1.2}
.colbar{height:5px;border-radius:2px;margin:5px auto 0;width:28px}
/* bars */
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:44px 1fr 64px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar .t{height:14px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar .t i{display:block;height:100%;background:var(--accent)}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:13px}
.path{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px}
.path .hop{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;background:var(--soft)}
.path .arr{color:var(--muted)}
.more{display:flex;justify-content:center;padding:14px}
.lineage{display:grid;gap:0}
.lin{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.lin:last-child{border-bottom:none}
.lin b{font-family:var(--display);font-weight:400}
.fpick{display:flex;flex-wrap:wrap;gap:6px}
/* fun facts */
.ticker{background:#14213d;color:#eef2f8;border-radius:10px;padding:16px 20px 18px;display:grid;gap:8px;border-left:6px solid var(--accent)}
.ticker .eyebrow{color:#ffb08a;margin-right:6px}
.ticker .sub{color:#aeb9cc}
.ticker .owner{color:#aeb9cc}
.tk-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tk-label{font-family:var(--display);font-size:18px}
.tk-nav{margin-left:auto;display:flex;gap:6px}
.ticker .btn{border-color:#eef2f8;color:#eef2f8;padding:5px 11px;text-decoration:none}
.ticker .btn:hover{background:#eef2f8;color:#14213d}
.tk-body{margin:0;font-size:clamp(16px,2.2vw,19px);line-height:1.45;max-width:75ch;min-height:2.9em}
.ticker .fdot{outline:1px solid rgb(255 255 255 / .4)}
.factgrid{columns:3 300px;column-gap:16px}
.factcard{break-inside:avoid;margin:0 0 16px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:14px 16px}
.factcard p{margin:6px 0 0;font-size:16px;line-height:1.45}
.column p{max-width:68ch;font-size:16.5px;line-height:1.65;margin:10px 0 0}
.column p:first-child{margin-top:6px}
a.pill{text-decoration:none}
svg text{fill:var(--muted);font-family:var(--cond);font-size:11px}
@media (max-width:560px){th.hm,td.hm{display:none}.pad{padding:14px}.chips{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script>
// Builds per-player stint timelines from the compact MFL export.
function buildLeague(raw) {
  const Y0 = 2018;
  const years = Object.keys(raw.fr).map(Number).sort((a, b) => a - b);
  const nSeasons = years.length;
  const fr = years.map(y => raw.fr[y]);
  const trades = raw.tr.split('\n').map(l => {
    const [d, f1, f2, g1, g2, yi] = l.split('|');
    return { d: +d, f1: +f1, f2: +f2, g1: g1 ? g1.split(',') : [], g2: g2 ? g2.split(',') : [], yi: yi === undefined ? null : +yi };
  });
  const byPlayer = new Map();
  raw.ev.split('\n').forEach(l => {
    const [d, k, pid, from, to, extra, yi] = l.split('|');
    if (!byPlayer.has(pid)) byPlayer.set(pid, []);
    byPlayer.get(pid).push({ d: +d, k, from: from ? +from : 0, to: to ? +to : 0, x: extra, yi: +yi });
  });
  // roster anchors: rosterAt[yi] = Map(pid -> fid)
  const rosterAt = years.map(y => {
    const m = new Map();
    raw.ro[y].forEach((s, i) => s && s.split(',').forEach(p => m.set(p, i + 1)));
    return m;
  });
  const allPids = new Set([...byPlayer.keys()]);
  rosterAt.forEach(m => m.forEach((_, p) => allPids.add(p)));
  // trades by season index, derived from day
  const dayToDate = d => new Date(Date.UTC(Y0, 0, 1) + d * 864e5);

  function stints(pid) {
    const evs = byPlayer.get(pid) || [];
    const S = [];
    let cur = null;
    const open = (fid, yi, d, how) => { cur = { fid, sy: yi, sd: d, how, ey: null, ed: null, end: null }; S.push(cur); };
    const close = (yi, d, end) => { cur.ey = yi; cur.ed = d; cur.end = end; cur = null; };
    const ensure = (fid, yi, d) => {
      if (cur && cur.fid === fid) return;
      if (cur) close(yi, null, { k: 'U' });
      const first = S.length === 0;
      open(fid, yi, null, { k: first && yi === 0 ? 'O' : 'U' });
    };
    let i = 0;
    for (let yi = 0; yi < nSeasons; yi++) {
      while (i < evs.length && evs[i].yi === yi) {
        const e = evs[i++];
        if (e.k === 'D' || e.k === 'A' || e.k === 'W') {
          if (cur && cur.fid === e.to) continue;
          if (cur) close(yi, e.d, { k: 'U' });
          open(e.to, yi, e.d, { k: e.k, x: e.x });
        } else if (e.k === 'T') {
          ensure(e.from, yi, e.d);
          close(yi, e.d, { k: 'T', tr: +e.x, to: e.to });
          open(e.to, yi, e.d, { k: 'T', tr: +e.x, from: e.from });
        } else if (e.k === 'X') {
          ensure(e.from, yi, e.d);
          close(yi, e.d, { k: 'X' });
        }
      }
      const t = rosterAt[yi].get(pid);
      if (t) ensure(t, yi, null);
      else if (cur) close(yi, null, { k: 'U' });
      // redraft: rosters reset every year, so a stint ends with its season (the current one stays open)
      if (raw.redraft && cur && yi < nSeasons - 1) close(yi, null, { k: 'S' });
    }
    return S;
  }
  // owner on a given day: a new owner who took over in the offseason before the league year rolled over (raw.hand[f] = [[day, season, name]])
  const ownerAt = (f, yi, d) => { const n = ((fr[yi] || [])[f - 1] || [])[1] || ''; if (d == null || !raw.hand || !raw.hand[f]) return n; const h = raw.hand[f].find(([dd, y]) => y === years[yi] && d >= dd); return h ? h[2] : n; };
  return { Y0, years, nSeasons, fr, trades, byPlayer, rosterAt, allPids, stints, dayToDate, ownerAt };
}


// League-wide breakdowns computed from the compact export + buildLeague().
function analyze(raw, L) {
  const years = L.years, nS = L.nSeasons, last = nS - 1;
  const F = Math.max(12, ...years.map(y => (raw.fr[y] || []).length));
  const r1 = x => Math.round(x * 10) / 10;

  // ---- stint stats (points per stint)
  const ssMap = new Map(), ssRaw = new Map();

/* ---------- PLAYERS ---------- */
function howIn(s, pid) {
  const h = s.how, d = fmt(s.sd); const when = d ? `<div class="when">${d}</div>` : '';
  switch (h.k) {
    case 'D': { const [y, pk] = (h.x || '').split(' '); return `<div class="how">Drafted, ${esc(y)} pick ${esc(pk)}</div>${when}`; }
    case 'W': { const m = money(h.x); return `<div class="how">Waiver claim${m ? ', ' + m : ''}</div>${when}`; }
    case 'A': return `<div class="how">Free agent pickup</div>${when}`;
    case 'T': return `<div class="how">Traded from ${esc(team(h.from, s.sy)[0])}</div>${when}${dealBox(h.tr, pid)}`;
    case 'O': return `<div class="how">On the ${years[0]} roster</div><div class="when">Before the league's records start</div>`;
    default: return `<div class="how">Joined in ${yr(s.sy)}</div><div class="when">Move not in the league's records</div>`;
  }
}
function howOut(s, pid) {
  if (!s.end) return `<div class="how">On the roster now <span class="tag cur">Current</span></div>`;
  const e = s.end, d = fmt(s.ed); const when = d ? `<div class="when">${d}</div>` : '';
  switch (e.k) {
    case 'T': return `<div class="how">Traded to ${esc(team(e.to, s.ey)[0])}</div>${when}${dealBox(e.tr, pid)}`;

    <div class="controls" style="margin-bottom:6px"><label for="pmin">Show picks traded at least<select id="pmin">${[1, 2, 3, 4].map(n => `<option value="${n}"${pkstate.min === n ? ' selected' : ''}>${n} ${n === 1 ? 'time' : 'times'}</option>`).join('')}</select></label>
    <label for="py">Draft year<select id="py"><option value="">All years</option>${pickYears.map(y => `<option${+pkstate.y === y ? ' selected' : ''}>${y}</option>`).join('')}</select></label><span class="sub" style="margin-left:auto">${js.length} picks</span></div>

  <aside class="grid3" style="grid-template-columns:1fr">
    <section class="card pad"><h3>What a pick is worth</h3><p class="sub">Started points the player at each slot has typically given the team that drafted him in this league${A.pickCurve.years.length ? `, from the ${A.pickCurve.years[0]}–${A.pickCurve.years[A.pickCurve.years.length - 1]} drafts` : ''}. Trade grades use these for picks that were traded away again.</p>
      <div class="bars" style="margin-top:8px">${[1, 2, 3, 4, 6, 8, 10, 12].map(p2 => { const v = A.slotValue(p2), m = A.slotValue(1) || 1; return `<div class="bar"><span>1.${String(p2).padStart(2, '0')}</span><span class="t"><i style="width:${v / m * 100}%"></i></span><span class="num">${v}</span></div>`; }).join('')}${[2, 3, 4].map(r => { const v = A.roundValue(r), m = A.slotValue(1) || 1; return `<div class="bar"><span>${ord(r)}</span><span class="t"><i style="width:${v / m * 100}%"></i></span><span class="num">${v}</span></div>`; }).join('')}</div>

      <details id="pick-method" style="margin-top:12px" open><summary>How pick values work</summary><div class="column" style="font-size:15px">

        <p>One draft is too noisy to price a slot on its own, so each slot's value is the average of the picks around it. Early in the 1st round that means just a pick or two on either side. Later on the window widens, since a 3.07 and a 3.11 are close to interchangeable. The values are then forced to only go down as picks get later, so a lucky late hit never makes the 1.12 worth more than the 1.10. Startup drafts and drafts MFL never recorded are left out.</p>

  // facts
  const LY = yr.length - 1; const climb = [...FC.teams].sort((a, b) => (b.byYear[0].rank - b.byYear[LY].rank) - (a.byYear[0].rank - a.byYear[LY].rank));
  const up = climb[0], down = climb[climb.length - 1];
  const youngest = [...FC.teams].sort((a, b) => a.wAge - b.wAge)[0], oldest = [...FC.teams].sort((a, b) => b.wAge - a.wAge)[0];
  const hoard = [...FC.teams].sort((a, b) => b.pickValue - a.pickValue)[0];
  const fsup = (eb, html) => `<div class="fact"><div class="eyebrow">${eb}</div><div>${html}</div></div>`;
  const facts = `<div class="facts">${[
    up && up.byYear[0].rank > up.byYear[LY].rank ? fsup('Biggest projected climb', `${FS(up.f)} goes from <b>${ord(up.byYear[0].rank)}</b> now to <b>${ord(up.byYear[LY].rank)}</b> by ${yr[LY]}.`) : '',
    down && down.byYear[LY].rank > down.byYear[0].rank ? fsup('Biggest projected slide', `${FS(down.f)} goes from <b>${ord(down.byYear[0].rank)}</b> now to <b>${ord(down.byYear[LY].rank)}</b> by ${yr[LY]}.`) : '',
    fsup('Youngest core', `${FS(youngest.f)}'s lineup averages <b>${n1(youngest.wAge)}</b> years old, weighted by production.`),
    fsup('Oldest core', `${FS(oldest.f)}'s lineup averages <b>${n1(oldest.wAge)}</b>, with ${Math.round(oldest.oldShare * 100)}% of its points from players 28 or older.`),
    fsup('Pick hoarder', `${FS(hoard.f)} holds <b>${hoard.picks.length}</b> picks over the next ${FC.drafts.length} drafts, ${hoard.firsts} of them 1sts. That should produce about <b>${n1(hoard.expHits)}</b> hits.`),
  ].join('')}</div>`;
  // age
  const maxA = Math.max(...FC.teams.map(t => t.wAge)), minA = Math.min(...FC.teams.map(t => t.wAge));
  const ageRows = [...FC.teams].sort((a, b) => a.wAge - b.wAge).map(t => `<div class="bar" style="grid-template-columns:minmax(0,8em) 1fr 56px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${FS(t.f)}</span><span class="t"><i style="width:${(t.wAge - minA + 0.6) / (maxA - minA + 0.6) * 100}%;background:color-mix(in srgb, var(--loss) ${Math.round(t.oldShare * 100)}%, var(--win))"></i></span><span class="num">${n1(t.wAge)}</span></div>`).join('');
  const age = `<section class="card pad" id="fc-age"><h3>How old is each lineup?</h3><p class="sub">Average age of each team's current best lineup, weighted by how much each player scores. Redder bars lean harder on players 28 and up.</p><div class="bars" style="margin-top:10px">${ageRows}</div></section>`;
  // pick capital
  const rn = r => ['', '1st', '2nd', '3rd', '4th', '5th', '6th'][r] || r + 'th';
  const chip = (k, f) => `<span class="fc-pk${k.orig !== f ? ' in' : ''}" title="${k.orig !== f ? 'From ' + esc(owner(k.orig)) : 'Own pick'}">${rn(k.rd)}${k.orig !== f ? `<small>${esc(short(k.orig).split(' ')[0])}</small>` : ''}</span>`;
  const maxPV = Math.max(1, ...FC.teams.map(t => t.pickValue));
  const capital = `<section class="card fc-cap" id="fc-picks"><div class="pad"><h3>Pick capital</h3><p class="sub">Every rookie pick each team holds in the next ${FC.drafts.length} drafts. Picks acquired from someone else are filled in and labeled with the original owner. Expected hits is how many of them should become regular starters, from this league's hit rates by slot, nudged up or down by the owner's own drafting record. Value is what those picks usually turn into here, in value over a replacement starter.</p></div>
    <div class="tbl"><table><thead><tr><th>Team</th>${FC.drafts.map(y => `<th>${y}</th>`).join('')}<th class="num">Expected hits</th><th>Value</th></tr></thead><tbody>${[...FC.teams].sort((a, b) => b.pickValue - a.pickValue).map(t => `<tr><td style="white-space:nowrap">${FS(t.f)}</td>${FC.drafts.map(y => `<td><div class="fc-pks">${t.picks.filter(k => k.y === y).sort((a, b) => a.rd - b.rd).map(k => chip(k, t.f)).join('') || '<span class="owner">none</span>'}</div></td>`).join('')}<td class="num"><b>${n1(t.expHits)}</b>${Math.abs(t.skill - 1) >= 0.08 ? `<div class="owner">${t.skill > 1 ? 'good' : 'shaky'} drafter</div>` : ''}</td><td style="min-width:120px"><span class="dr-track" style="width:70px"><i class="dr-bar" style="left:0;width:${t.pickValue / maxPV * 100}%;background:var(--accent)"></i></span> ${n0(t.pickValue)}</td></tr>`).join('')}</tbody></table></div></section>`;
  // next draft
  const nd = FC.nextDraft;
  const draftOrder = nd.length ? `<section class="card pad" id="fc-draft"><h3>The ${FC.drafts[0]} draft, if the season ended today</h3><p class="sub">Projected order from current playoff odds, worst first, with whoever holds each pick now. Traded picks are marked.</p>
    <ol class="list fc-order">${nd.map(k => `<li><span><span class="rk">${k.rd}.${String(k.slot).padStart(2, '0')}</span> ${FS(k.holder)}${k.holder !== k.orig ? ` <span class="owner">via ${esc(short(k.orig))}</span>` : ''}</span><span class="owner">${k.holder !== k.orig ? '<span class="tag">Traded</span>' : ''}</span></li>`).join('')}</ol></section>` : '';
  const pli = (p, right, sub) => `<li><span>${P(p.pid)} <span class="owner">${esc(p.pos)}${p.age != null ? ', ' + Math.floor(p.age) : ''} · ${esc(short(p.f))}</span></span><span class="v">${right(p)}</span></li>`;
  const lists = `<div class="grid2"><section class="card pad" id="fc-cliff"><h3>Cliff watch</h3><p class="sub">Current starters the age curve expects to fall off hardest next season, in points per week.</p><ol class="list">${FC.cliff.map(p => pli(p, p => `${n1(p.now)} → <b style="color:var(--loss)">${n1(p.next)}</b>`)).join('')}</ol></section>
    <section class="card pad" id="fc-rising"><h3>Rising stars</h3><p class="sub">Players under 25 projected to score the most per week in ${yr[2]}.</p><ol class="list">${FC.rising.map(p => pli(p, p => `${n1(p.now)} → <b style="color:var(--win)">${n1(p.later)}</b>`)).join('')}</ol></section></div>`;
  const how = `<section class="card pad"><details><summary><b>How the future cast works</b></summary><div class="column" style="font-size:15px">
    <p>Every rostered player starts from what he scores now: points per week this season, blended with last season while this year's sample is small. Rookies with no history start at what their draft slot usually produces in this league.</p>
    <p>Each player is then aged forward one season at a time with a position-specific curve. Running backs climb until about 25 and fall quickly after 27. Receivers peak in their mid to late 20s and fade after 30. Tight ends develop later, and quarterbacks hold value well into their 30s. Second-year players get an extra bump.</p>
    <p>Each projected season, a team's best ${FC.S}-man lineup is built from its projected players, in this league's lineup shape. Empty or weak spots get a typical waiver pickup.</p><p>Future picks are simulated, not averaged. Each pick is drawn ${200} times from the real results of picks made near that slot in this league, so most come up as busts and a few as stars, the way real drafts go. Owners with a better hit rate get slightly better draws and owners with a worse one slightly worse, held close to the league average until they've made a lot of picks. A rookie counts for less in year one and grows into his value by year three. Every simulated lineup is scored and the results averaged, so a team with a pile of picks gets credit for the handful that should hit. The ${FC.drafts[0]} picks are slotted by current playoff odds, and later picks count as mid-round.</p>
    <p>It's a sketch, not a prophecy. Trades, injuries and the waiver wire will rewrite all of it, so it reruns every Tuesday.</p></div></details></section>`;
  const nav = `<div class="pills jump">${[['fc-windows', 'Windows'], ['fc-age', 'Age'], ['fc-picks', 'Pick capital'], ['fc-draft', `${FC.drafts[0]} draft`], ['fc-cliff', 'Cliff watch'], ['fc-rising', 'Rising stars']].map(([id, t]) => `<a class="pill" href="#${id}" data-jump="${id}">${t}</a>`).join('')}</div>`;
  main.innerHTML = `<section><div class="eyebrow">${yr[1]}–${yr[yr.length - 1]}</div><h2 class="sec">Future cast</h2><p class="lede">Where every team is headed, based on how old its roster is, what its players score now, and the draft picks it holds.</p></section>${nav}
    ${windows}${facts}${how}<div class="grid2">${age}${draftOrder}</div>${capital}${lists}`;
  main.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById(a.dataset.jump); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); });
}

/* ---------- WAIVER WIRE ---------- */
const wstate = { yi: String(last) };
function viewWaivers() {
  const yi = +wstate.yi;
  const rows = Object.values(A.faab[yi]);
  const maxSpent = Math.max(1, ...years.flatMap((_, k) => Object.values(A.faab[k]).map(r => r.spent)));
  const tr = rows.sort((a, b) => b.spent - a.spent).map(r => `<tr><td>${FS(r.f, yi)}</td><td class="num">${money(r.spent)}</td><td class="num">${r.claims}</td><td class="num hm">${money(r.max)}</td><td class="num">${r.adds}</td><td class="num">${r.drops}</td><td class="num">${r.trades}</td></tr>`).join('');
  // spending heat by owner x season
  let heat = `<table class="heat"><thead><tr><th>Owner</th>${years.map(y => `<th class="num">'${String(y).slice(2)}</th>`).join('')}<th class="num">Total</th></tr></thead><tbody>`;
  for (let f = 1; f <= NF; f++) { let tot = 0; heat += `<tr><td>${FSH(f)}</td>` + years.map((_, k) => { const s = A.faab[k][f].spent; tot += s; return `<td class="h" style="background:color-mix(in oklab, var(--accent) ${Math.round(s / maxSpent * 70)}%, transparent)">${s ? n0(s) : '·'}</td>`; }).join('') + `<td class="num"><b>${n0(tot)}</b></td></tr>`; }
  heat += '</tbody></table>';
  const bt = A.bidTrend; const mx = Math.max(...bt.map(b => b.avg));
  const bars = bt.map(b => `<div class="bar"><span>${b.y}</span><span class="t"><i style="width:${mx ? b.avg / mx * 100 : 0}%"></i></span><span class="num">${money(b.avg.toFixed(2))}</span></div>`).join('');
  const act = []; for (let f = 1; f <= NF; f++) { let m = 0; years.forEach((_, k) => { const r = A.faab[k][f]; m += r.claims + r.adds; }); act.push([f, m]); }
  act.sort((a, b) => b[1] - a[1]);
  const noF = !A.bigBids.length;
  main.innerHTML = `<section><h2 class="sec">Waiver wire</h2><p class="lede">${noF ? 'Waiver claims' : 'Blind-bid claims'}, free agent adds, and what those pickups produced. A pickup counts as a hit once he starts ${A.HIT} or more games for the team that grabbed him.</p></section>
  <section class="card"><div class="pad controls"><label for="wy">Season<select id="wy">${years.map((y, k) => `<option value="${k}"${k === yi ? ' selected' : ''}>${y}</option>`).join('')}</select></label></div>
  <div class="tbl"><table><thead><tr><th>Owner</th><th class="num">FAAB spent</th><th class="num">Claims won</th><th class="num hm">Biggest bid</th><th class="num">FA adds</th><th class="num">Drops</th><th class="num">Trades</th></tr></thead><tbody>${tr}</tbody></table></div></section>
  <div class="grid2">
    ${noF ? '' : `<section class="card pad"><h3>FAAB spent by season</h3><div class="tbl" style="margin-top:8px">${heat}</div></section>`}
    <section class="card pad">${noF ? '' : `<h3>Average winning bid</h3><p class="sub">Claims with a bid above zero.</p><div class="bars" style="margin-top:10px">${bars}</div>`}
      <h3 style="${noF ? '' : 'margin-top:18px'}">Busiest on the wire</h3><p class="sub">Claims plus free agent adds, all seasons.</p><ol class="list">${act.slice(0, 6).map(([f, c], i) => `<li><span><span class="rk">${i + 1}</span>${FSH(f)}</span><span class="v">${c}</span></li>`).join('')}</ol></section>
  </div>
  <div class="grid3">
    <section class="card pad"><h3>Hit rate</h3><p class="sub">Share of pickups that started ${A.HIT}+ games.</p><ol class="list">${[...A.hitRate].sort((a, b) => b.rate - a.rate).map((h, i) => `<li><span><span class="rk">${i + 1}</span>${FSH(h.f)} <span class="owner">${h.hits} of ${h.n}</span></span><span class="v">${pct(h.rate)}</span></li>`).join('')}</ol></section>
    <section class="card pad"><h3>Best pickups ever</h3><p class="sub">Started points for the team that picked him up.</p><ol class="list">${A.bestPickups.slice(0, 15).map((s, i) => `<li><span><span class="rk">${i + 1}</span>${P(s.pid)}<br><span class="owner">${esc(short(s.fid, s.sy))}, ${yr(s.sy)}, ${s.how.k === 'W' ? (A.bid(s) ? money(A.bid(s)) + ' claim' : '$0 claim') : 'free agent'}</span></span><span class="v">${n0(s.pts)}</span></li>`).join('')}</ol></section>
    ${noF ? '' : `<section class="card pad"><h3>Biggest bids</h3><p class="sub">And what they returned in started points.</p><ol class="list">${A.bigBids.slice(0, 15).map((s, i) => `<li><span><span class="rk">${i + 1}</span>${P(s.pid)}<br><span class="owner">${esc(short(s.fid, s.sy))}, ${yr(s.sy)} · ${n0(s.pts)} pts</span></span><span class="v">${money(A.bid(s))}</span></li>`).join('')}</ol></section>`}
  </div>`;
  $('#wy').onchange = e => { wstate.yi = e.target.value; viewWaivers(); };
}

/* ---------- FRANCHISES ---------- */
function rankChart(s) {
  const W = 560, H = 190, padL = 30, padR = 12, padT = 12, padB = 26;
  const xs = yi => padL + (W - padL - padR) * (years.length === 1 ? 0 : yi / (years.length - 1));
  const ys = r => padT + (H - padT - padB) * ((r - 1) / 11);
  const pts = s.seasons.filter(x => x.g).map(x => [xs(x.yi), ys(x.rank), x]);
  let g = '';
  [1, 4, 8, 12].forEach(r => { g += `<line x1="${padL}" x2="${W - padR}" y1="${ys(r)}" y2="${ys(r)}" stroke="var(--rule)" stroke-width="1"/><text x="${padL - 8}" y="${ys(r) + 4}" text-anchor="end">${ord(r)}</text>`; });
  years.forEach((y, yi) => g += `<text x="${xs(yi)}" y="${H - 6}" text-anchor="middle">${y}</text>`);
  g += `<polyline fill="none" stroke="${fcol(s.f)}" stroke-width="3" stroke-linejoin="round" points="${pts.map(p => p[0] + ',' + p[1]).join(' ')}"/>`;
  pts.forEach(([x, y, r]) => { const champ = s.titles.includes(years[r.yi]); g += `<circle cx="${x}" cy="${y}" r="${champ ? 7 : 4.5}" fill="${champ ? 'var(--gold)' : fcol(s.f)}" stroke="var(--card)" stroke-width="2"><title>${years[r.yi]}: ${ord(r.rank)}, ${rec(r.w, r.l, r.t)}</title></circle>`; });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Regular season finish by year">${g}</svg>`;
}
function viewFranchises(f) {
  f = f || 8;
  const s = A.franchises[f - 1];
  const sel = Array.from({ length: NF }, (_, i) => i + 1).map(k => `<button class="pill" data-fsel="${k}" aria-pressed="${k === f}"><span class="fdot" style="--fcol:${fcol(k)};margin:0"></span>${esc(short(k))}</button>`).join('');
  const seasonRows = s.seasons.map(r => {
    const c = A.champions[r.yi]; const b = A.playoff[r.yi].find(x => x.teams.includes(f));
    let post = '–'; const PS = s.post[r.yi]; const wlT = PS && PS.w + PS.l ? ` <span class="owner">${rec(PS.w, PS.l)}</span>` : '';
    if (c.champ === f) post = `<span class="tag gold">${esc(c.title || 'Champion')}</span>${wlT}`; else if (c.runner === f) post = `<span class="tag">Runner-up</span>${wlT}`;
    else if (PS && PS.po) post = `Playoffs${wlT}${PS.won ? ` <span class="tag">${esc(PS.won)}</span>` : ''}`;
    else if (PS && PS.br) post = `${esc(PS.br)}${wlT}${PS.won ? ` <span class="tag">${esc(PS.won)}</span>` : ''}`;
    else if (b) post = esc(b.winner === f ? (b.title || b.name) : b.name);
    return `<tr><td><b>${years[r.yi]}</b>${platformOf(r.yi) && raw.platform && new Set(Object.values(raw.platform)).size > 1 ? ` <span class="tag">${esc(platformOf(r.yi))}</span>` : ''}<div class="owner">${esc(team(f, r.yi)[0])}</div></td><td class="num">${rec(r.w, r.l, r.t)}</td><td class="num">${ord(r.rank)}</td><td class="num">${n1(r.pf)}</td><td class="num hm">${pct(r.eff)}</td><td>${post}</td></tr>`;
  }).reverse().join('');
  const names = s.names.map((n, i) => { const end = s.names[i + 1] ? years[s.names[i + 1].yi - 1] : null; return `<div class="lin"><b>${years[n.yi]}${end && end !== years[n.yi] ? '–' + String(end).slice(2) : ''}</b><div><div class="team">${esc(n.name)}</div><div class="owner">${esc(n.owner)}</div></div></div>`; }).join('');
  const partners = Array.from({ length: NF }, (_, i) => i + 1).filter(k => k !== f).map(k => [k, A.partner[Math.min(f, k) + '-' + Math.max(f, k)] || 0]).sort((a, b) => b[1] - a[1]);
  const legends = A.legends[f - 1].top;
  const cur = (raw.ro[years[last]][f - 1] || '').split(',').filter(Boolean).map(p => S(p).find(x => x.fid === f && x.ey == null)).filter(Boolean).sort((a, b) => a.sy - b.sy || (a.sd ?? -1) - (b.sd ?? -1)).slice(0, 8);
  const kept = A.turnover[f - 1].kept;
  main.innerHTML = `<section><h2 class="sec">${esc(curTeam(f))}</h2><p class="lede">${esc(owner(f))}${s.owners.length > 1 ? `, who took over from ${esc(s.owners.filter(o => o !== owner(f)).join(' and '))}` : ''}. ${rec(s.w, s.l, s.t)} all-time${s.titles.length ? `, champion in ${s.titles.join(', ')}` : ''}.</p></section>
  <div class="pills">${sel}</div>
  <div class="facts"><div class="fact"><div class="eyebrow">Playoff trips</div><div class="big">${s.playoffs}</div><div class="sub">Record ${rec(s.pw, s.pl)} in playoff games</div></div><div class="fact"><div class="eyebrow">Titles</div><div class="big">${s.titles.length}</div><div class="sub">${s.finals.length} more ${s.finals.length === 1 ? 'final' : 'finals'} lost</div></div>${A.franchises.some(x => x.lb) ? `<div class="fact"><div class="eyebrow">Losers bracket trips</div><div class="big">${s.lb}</div><div class="sub">Record ${rec(s.lbw, s.lbl)}${s.lbT.length ? `, won ${s.lbT.map(x => `${esc(x[1])} ${x[0]}`).join(', ')}` : ''}</div></div>` : ''}<div class="fact"><div class="eyebrow">Postseason overall</div><div class="big">${rec(s.pw + s.lbw, s.pl + s.lbl)}</div><div class="sub">Every postseason game, both brackets</div></div></div>
  <div class="grid2">
    <section class="card pad"><h3>Finish by season</h3><p class="sub">Regular season standing. Gold marks a title.</p>${rankChart(s)}</section>
    <section class="card pad"><h3>Team names over the years</h3><div class="lineage">${names}</div></section>
  </div>
  <section class="card"><div class="pad"><h3>Season by season</h3></div><div class="tbl"><table><thead><tr><th>Season</th><th class="num">Record</th><th class="num">Finish</th><th class="num">Points for</th><th class="num hm">Lineup eff.</th><th>Postseason</th></tr></thead><tbody>${seasonRows}</tbody></table></div></section>
  <div class="grid3">
    <section class="card pad"><h3>Franchise legends</h3><p class="sub">Most started points for this franchise, all stints combined.</p><ol class="list">${legends.map((x, i) => `<li><span><span class="rk">${i + 1}</span>${P(x.pid)}</span><span class="v">${n0(x.pts)}</span></li>`).join('')}</ol></section>
    ${raw.redraft ? `<section class="card pad"><h3>Old reliables</h3><p class="sub">Players this team has rostered in the most seasons.</p><ol class="list">${A.repeat.filter(x => x.f === f).slice(0, 8).map((x, i) => `<li><span><span class="rk">${i + 1}</span>${P(x.pid)}<br><span class="owner">${x.ys.map(k => years[k]).join(', ')}</span></span><span class="v">${x.n}</span></li>`).join('') || '<li class="owner">Nobody yet.</li>'}</ol></section>` : `<section class="card pad"><h3>Longest-tenured now</h3><p class="sub">Current roster, by when they arrived.</p><ol class="list">${cur.map((x, i) => `<li><span><span class="rk">${i + 1}</span>${P(x.pid)}</span><span class="owner">since ${yr(x.sy)}</span></li>`).join('')}</ol></section>`}
    <section class="card pad"><h3>Trade partners</h3><ol class="list">${partners.slice(0, 6).map(([k, c], i) => `<li><span><span class="rk">${i + 1}</span>${FSH(k)}</span><span class="v">${c}</span></li>`).join('')}</ol>
      ${raw.redraft ? '' : `<h3 style="margin-top:16px">Roster carryover</h3><p class="sub">Share of last season's final roster still there at the end of the next.</p><div class="bars" style="margin-top:8px">${kept.map((k, i) => `<div class="bar"><span>${years[i + 1]}</span><span class="t"><i style="width:${k * 100}%;background:${fcol(f)}"></i></span><span class="num">${pct(k)}</span></div>`).join('')}</div>`}</section>
  </div>`;
  main.querySelectorAll('[data-fsel]').forEach(b => b.onclick = () => go('f' + b.dataset.fsel));
}

/* ---------- RIVALRIES ---------- */
let rpair = null;
function viewRivalries() {
  let mx = '<table class="matrix"><thead><tr><th></th>' + Array.from({ length: NF }, (_, i) => `<th style="vertical-align:bottom"><div class="colh">${esc(short(i + 1))}</div><div class="colbar" style="background:${fcol(i + 1)}"></div></th>`).join('') + '</tr></thead><tbody>';
  for (let a = 1; a <= NF; a++) {
    mx += `<tr><th class="rowh"><span class="fdot" style="--fcol:${fcol(a)}"></span>${esc(shortH(a))}</th>`;
    for (let b = 1; b <= NF; b++) {
      if (a === b) { mx += '<td><span class="mc self"></span></td>'; continue; }
      const h = A.h2h[a + '-' + b] || { w: 0, l: 0, t: 0 }; const n = h.w + h.l + h.t; const p = n ? (h.w + h.t / 2) / n : .5;
      const c = p >= .5 ? `color-mix(in oklab, var(--win) ${Math.round((p - .5) * 160)}%, var(--soft))` : `color-mix(in oklab, var(--loss) ${Math.round((.5 - p) * 160)}%, var(--soft))`;
      mx += `<td><button class="mc" data-rp="${a}-${b}" aria-pressed="${rpair === a + '-' + b}" style="background:${c}" title="${esc(owner(a))} vs ${esc(owner(b))}">${h.w}–${h.l}${h.t ? '–' + h.t : ''}</button></td>`;
    }
    mx += '</tr>';
  }
  mx += '</tbody></table>';
  // biggest rivalries
  const pairs = []; for (let a = 1; a <= NF; a++) for (let b = a + 1; b <= NF; b++) { const h = A.h2h[a + '-' + b]; if (h) pairs.push({ a, b, h, n: h.w + h.l + h.t, po: h.games.filter(g => g.kind === 'playoff').length }); }
  const lopsided = [...pairs].filter(p => p.n >= 6).sort((x, y) => Math.abs(y.h.w - y.h.l) - Math.abs(x.h.w - x.h.l)).slice(0, 6);
  const playoffRiv = [...pairs].filter(p => p.po).sort((x, y) => y.po - x.po).slice(0, 6);
  let detail = '<p class="sub">Tap any square to see every game between those two franchises.</p>';
  if (rpair) {
    const [a, b] = rpair.split('-').map(Number); const h = A.h2h[rpair];
    if (h) detail = `<h3>${esc(shortH(a))} vs ${esc(shortH(b))}</h3><p class="sub">${esc(owner(a))} is ${rec(h.w, h.l, h.t)} with ${n1(h.pf)} points for and ${n1(h.pa)} against.</p><div class="tbl"><table><thead><tr><th>Season</th><th>Week</th><th class="num">${esc(shortH(a))}</th><th class="num">${esc(shortH(b))}</th><th></th></tr></thead><tbody>${[...h.games].sort((x, y) => y.yi - x.yi || y.w - x.w).map(g => `<tr><td>${years[g.yi]}</td><td>${g.w}${g.kind === 'playoff' ? ' <span class="tag">Playoffs</span>' : ''}</td><td class="num">${n1(g.sx)}</td><td class="num">${n1(g.sy)}</td><td>${g.sx > g.sy ? '<span class="tag w">W</span>' : g.sx < g.sy ? '<span class="tag l">L</span>' : '<span class="tag">T</span>'}</td></tr>`).join('')}</tbody></table></div>`;
  }
  main.innerHTML = `<section><h2 class="sec">Rivalries</h2><p class="lede">Head-to-head records for every pairing, regular season plus championship bracket games. Read across a row: green means the row owner leads the series.</p></section>
  <div class="grid2"><section class="card pad"><div class="tbl">${mx}</div></section><section class="card pad" id="rdet">${detail}</section></div>
  <div class="grid2">
    <section class="card pad"><h3>Most one-sided series</h3><p class="sub">At least six meetings.</p><ol class="list">${lopsided.map((p, i) => { const lead = p.h.w >= p.h.l ? [p.a, p.b, p.h.w, p.h.l] : [p.b, p.a, p.h.l, p.h.w]; return `<li><span><span class="rk">${i + 1}</span>${FS(lead[0])} over ${FS(lead[1])}</span><span class="v">${lead[2]}–${lead[3]}</span></li>`; }).join('')}</ol></section>
    <section class="card pad"><h3>Playoff rivalries</h3><p class="sub">Pairs that keep meeting in the championship bracket.</p><ol class="list">${playoffRiv.map((p, i) => { const g = p.h.games.filter(x => x.kind === 'playoff'); const w = g.filter(x => x.sx > x.sy).length; return `<li><span><span class="rk">${i + 1}</span>${FSH(p.a)} vs ${FSH(p.b)} <span class="owner">${esc(shortH(p.a))} ${w}–${g.length - w}</span></span><span class="v">${p.po}</span></li>`; }).join('')}</ol></section>
  </div>`;
  main.querySelectorAll('[data-rp]').forEach(b => b.onclick = () => { rpair = b.dataset.rp; viewRivalries(); $('#rdet').scrollIntoView({ block: 'nearest' }); });
}

/* ---------- RECORDS ---------- */
function viewRecords() {
  const R = A.records;
  const tw = (x, val) => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}${x.reg ? '' : ', playoffs'}</span></span><span class="v">${val}</span></li>`;
  const box = (title, sub, items) => `<section class="card pad" id="rec-${slug(title)}"><h3>${title}</h3><p class="sub">${sub}</p><ol class="list">${items}</ol></section>`;
  main.innerHTML = `<section><h2 class="sec">Record book</h2><p class="lede">Single weeks and full seasons, ${years[0]} through this week.</p></section>
  <div class="grid3">
    ${box('Highest-scoring weeks', 'Team points in one week.', R.highWeek.map(x => tw(x, n1(x.s))).join(''))}
    ${box('Lowest-scoring weeks', 'Team points in one week.', R.lowWeek.map(x => tw(x, n1(x.s))).join(''))}
    ${box('Biggest blowouts', 'Margin of victory.', R.blowouts.map(x => `<li><span>${FS(x.f, x.yi)} over ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s - x.os)}</span></li>`).join(''))}
    ${box('Closest games', 'Margin of victory.', R.closest.map(x => `<li><span>${FS(x.f, x.yi)} over ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${(x.s - x.os).toFixed(2)}</span></li>`).join(''))}
    ${box('Toughest losses', 'Most points scored in a regular season loss.', R.unluckyLoss.map(x => `<li><span>${FS(x.f, x.yi)} lost to ${FS(x.opp, x.yi)} <span class="owner">${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s)}</span></li>`).join(''))}
    ${box('Points left on the bench', 'Best possible lineup minus the lineup that played.', R.benchLeft.map(x => tw(x, n1(x.o - x.s))).join(''))}
    ${box('Best player weeks', 'Single-week points by a starter.', R.playerWeeks.slice(0, 12).map(x => `<li><span>${P(x.pid)}<br><span class="owner">${esc(short(x.f, x.yi))}, ${years[x.yi]} wk ${x.w}</span></span><span class="v">${n1(x.s)}</span></li>`).join(''))}
    ${box('Most points in a season', 'Regular season points for.', R.seasonPF.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}, ${rec(x.w, x.l, x.t)}</span></span><span class="v">${n0(x.pf)}</span></li>`).join(''))}
    ${box('Best lineup setters', 'Season lineup efficiency.', R.seasonEff.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}</span></span><span class="v">${pct(x.eff)}</span></li>`).join(''))}
    ${box('Worst lineup setters', 'Season lineup efficiency.', R.worstEff.map(x => `<li><span>${FS(x.f, x.yi)} <span class="owner">${years[x.yi]}</span></span><span class="v">${pct(x.eff)}</span></li>`).join(''))}
    ${box('Boomerangs', raw.redraft ? 'Let go and brought back by the same team in the same season. Ranked by started points after he came back.' : 'Came back to a franchise that had let him go. Ranked by started points in the return stint.', A.boomerangs.slice(0, 12).map(b => `<li><span>${P(b.pid)}<br><span class="owner">${esc(short(b.f, b.back.sy))}, back in ${years[b.back.sy]}${b.away.length ? ' after ' + b.away.map(k => esc(short(k))).join(', ') : ''}</span></span><span class="v">${n0(b.back.pts)}</span></li>`).join(''))}
    ${box('Longest stints', 'Weeks on one roster without leaving.', A.longest.slice(0, 12).map(s => `<li><span>${P(s.pid)}<br><span class="owner">${esc(short(s.fid, s.sy))}, ${yr(s.sy)}–${s.ey == null ? 'now' : yr(s.ey)}</span></span><span class="v">${s.wks}</span></li>`).join(''))}
  </div>`;
}

/* ---------- FUN FACTS ---------- */
function buildFacts() {
  const F = [], add = (cat, html) => F.push({ cat, html });
  const fr = A.franchises;
  const wk = (yi, w) => `${years[yi]}, week ${w}`;
  // rivalries
  const pairs = []; for (let a = 1; a <= NF; a++) for (let b = a + 1; b <= NF; b++) { const h = A.h2h[a + '-' + b]; if (h) pairs.push({ a, b, h, n: h.w + h.l + h.t }); }
  pairs.filter(p => p.n >= 6).sort((x, y) => Math.abs(y.h.w - y.h.l) / y.n - Math.abs(x.h.w - x.h.l) / x.n).slice(0, 4).forEach(p => {
    const [W, Lo, w, l] = p.h.w >= p.h.l ? [p.a, p.b, p.h.w, p.h.l] : [p.b, p.a, p.h.l, p.h.w];
    const po = A.h2h[W + '-' + Lo].games.filter(g => g.kind === 'playoff'); const pw = po.filter(g => g.sx > g.sy).length;
    add('Rivalries', `${FA(W)} is <b>${w}–${l}</b> all-time against ${FA(Lo)}${po.length ? `, including ${pw}–${po.length - pw} in the playoffs` : ''}.`);
  });
  const even = pairs.filter(p => p.n >= 8).sort((x, y) => Math.abs(x.h.w - x.h.l) - Math.abs(y.h.w - y.h.l) || y.n - x.n)[0];
  if (even) add('Rivalries', `${FA(even.a)} and ${FA(even.b)} have met ${even.n} times and the series stands at <b>${even.h.w}–${even.h.l}</b>. Total points: ${n0(even.h.pf)} to ${n0(even.h.pa)}.`);
  // titles
  const byOwner = {}; EARLY_ALL.forEach(e => e[4] && splitO(e[4]).forEach(o => { const fy = fyOf(o); (byOwner[o] = byOwner[o] || { o, f: fy && fy[0], yi: fy ? fy[1] : last, t: [] }).t.push(e[0]); })); A.champions.forEach(c => { if (!c.champ) return; splitO(owner(c.champ, c.yi)).forEach(o => (byOwner[o] = byOwner[o] || { o, f: c.champ, yi: c.yi, t: [] }).t.push(c.y)); }); Object.values(byOwner).forEach(x => x.t.sort((a, b) => a - b));
  const topT = Object.values(byOwner).sort((a, b) => b.t.length - a.t.length)[0];
  if (topT) { const t = topT.t; const b2b = t.some((y, i) => t[i + 1] === y + 1); add('Champions', `${topT.f ? FN(topT.f, topT.yi) : esc(topT.o)} has won <b>${t.length} ${t.length === 1 ? 'title' : 'titles'}</b> (${t.join(', ')})${b2b ? ', including back-to-back championships' : ''}.`); }
  const noRing = fr.filter(s => !s.titles.length && !earlyTitles(s.f) && s.w + s.l).sort((a, b) => b.w / (b.w + b.l) - a.w / (a.w + a.l))[0];
  if (noRing) add('Champions', `${FA(noRing.f)} owns the best regular season record of anyone without a title: <b>${rec(noRing.w, noRing.l, noRing.t)}</b>.`);
  const poBest = [...fr].sort((a, b) => b.pw - a.pw)[0]; add('Champions', `${FA(poBest.f)} has the most championship-bracket wins with <b>${poBest.pw}</b>.`);
  const poApp = fr.filter(s => !s.titles.length && !earlyTitles(s.f)).sort((a, b) => b.playoffs - a.playoffs)[0]; if (poApp && poApp.playoffs) add('Champions', `${FA(poApp.f)} has made the playoffs <b>${poApp.playoffs} times</b> without winning it all.`);
  const byRunner = {}; EARLY_ALL.forEach(e => e[5] && splitO(e[5]).forEach(o => { const fy = fyOf(o); (byRunner[o] = byRunner[o] || { o, f: fy && fy[0], yi: fy ? fy[1] : last, t: [] }).t.push(e[0]); })); A.champions.forEach(c => { if (!c.runner) return; splitO(owner(c.runner, c.yi)).forEach(o => (byRunner[o] = byRunner[o] || { o, f: c.runner, yi: c.yi, t: [] }).t.push(c.y)); }); Object.values(byRunner).forEach(x => x.t.sort((a, b) => a - b));
  const topR = Object.values(byRunner).sort((a, b) => b.t.length - a.t.length)[0]; if (topR && topR.t.length > 1) add('Champions', `${topR.f ? FN(topR.f, topR.yi) : esc(topR.o)} has lost in the title game <b>${topR.t.length} times</b> (${topR.t.join(', ')}).`);
  // games
  const R = A.records;
  const ul = R.unluckyLoss[0]; if (ul) add('Weekly', `${FN(ul.f, ul.yi)} scored <b>${n1(ul.s)}</b> in ${wk(ul.yi, ul.w)} and still lost to ${FN(ul.opp, ul.yi)}.`);
  const tw = []; A.games.forEach(g => { tw.push({ f: g.a, s: g.sa, opp: g.b, os: g.sb, yi: g.yi, w: g.w, reg: g.reg }); tw.push({ f: g.b, s: g.sb, opp: g.a, os: g.sa, yi: g.yi, w: g.w, reg: g.reg }); });
  const lowWin = tw.filter(x => x.s > x.os && x.reg && x.s > 0).sort((a, b) => a.s - b.s)[0]; if (lowWin) add('Weekly', `${FN(lowWin.f, lowWin.yi)} won a game in ${wk(lowWin.yi, lowWin.w)} with only <b>${n1(lowWin.s)}</b> points.`);
  const bl = R.blowouts[0]; add('Weekly', `The biggest blowout on record: ${FN(bl.f, bl.yi)} beat ${FN(bl.opp, bl.yi)} by <b>${n1(bl.s - bl.os)}</b> in ${wk(bl.yi, bl.w)}.`);
  const cl = R.closest[0]; add('Weekly', `The closest game ever: ${FN(cl.f, cl.yi)} edged ${FN(cl.opp, cl.yi)} by <b>${(cl.s - cl.os).toFixed(2)}</b> points in ${wk(cl.yi, cl.w)}.`);
  const bn = R.benchLeft[0]; add('Lineups', `${FN(bn.f, bn.yi)} left <b>${n1(bn.o - bn.s)} points</b> on the bench in ${wk(bn.yi, bn.w)}.`);
  const hw = R.highWeek[0]; add('Weekly', `The highest score in league history is <b>${n1(hw.s)}</b>, by ${FN(hw.f, hw.yi)} in ${wk(hw.yi, hw.w)}.`);
  const pwk = R.playerWeeks[0]; if (pwk) add('Players', `${P(pwk.pid)} put up <b>${n1(pwk.s)} points</b> in one week for ${FN(pwk.f, pwk.yi)} (${wk(pwk.yi, pwk.w)}), the best starter week on record.`);
  const se = R.seasonEff[0]; add('Lineups', `${FN(se.f, se.yi)} set lineups at <b>${pct(se.eff)}</b> of the best possible score in ${years[se.yi]}, the sharpest season on record.`);
  const sp = R.seasonPF[0]; add('Weekly', `${FN(sp.f, sp.yi)} scored <b>${n0(sp.pf)}</b> regular season points in ${years[sp.yi]}, the most ever.`);
  // players
  const tv = travel[0]; if (raw.redraft) { const rp = A.repeat[0]; if (rp) add('Players', `${FN(rp.f, rp.ys[rp.ys.length - 1])} has had ${P(rp.pid)} on his roster in <b>${rp.n} different seasons</b> (${rp.ys.map(k => years[k]).join(', ')}).`); } else add('Players', `${P(tv[0].id)} has been rostered by <b>${tv[1]} of the ${NFR} franchises</b> across ${tv[2]} separate stints.`);
  const tradedMost = A.allP.map(p => [p, S(p).filter(s => s.how.k === 'T').length]).sort((a, b) => b[1] - a[1])[0];
  add('Players', `${P(tradedMost[0])} has been traded <b>${tradedMost[1]} times</b>, more than any other player.`);
  // ping-pong: same player traded between the same two franchises 3+ times
  const pong = []; A.allP.forEach(p => { const c = {}; S(p).filter(s => s.how.k === 'T').forEach(s => { const k = Math.min(s.fid, s.how.from) + '-' + Math.max(s.fid, s.how.from); c[k] = (c[k] || 0) + 1; }); Object.entries(c).forEach(([k, n]) => n >= 3 && pong.push([p, k, n])); });
  pong.sort((a, b) => b[2] - a[2]).slice(0, 2).forEach(([p, k, n]) => { const [a, b] = k.split('-').map(Number); add('Trades', `${P(p)} was traded between ${FA(a)} and ${FA(b)} <b>${n} times</b>.`); });
  const lg = A.longest[0]; if (!raw.redraft) add('Players', `${P(lg.pid)} has spent <b>${lg.wks} weeks</b> on ${lg.ey == null ? FA(lg.fid) : FN(lg.fid, lg.sy)}'s roster without ever leaving${lg.ey == null ? ', and he is still there' : ''}.`);
  const leg = A.legends.map(x => ({ f: x.f, ...x.top[0] })).filter(x => x.pid).sort((a, b) => b.pts - a.pts)[0]; add('Players', `${P(leg.pid)} has scored <b>${n0(leg.pts)} started points</b> for ${FA(leg.f)}, the most any player has given one franchise.`);
  const bm = {}; A.boomerangs.forEach(b => { const k = b.pid + '|' + b.f; bm[k] = (bm[k] || 1) + 1; }); const bmTop = Object.entries(bm).sort((a, b) => b[1] - a[1])[0];
  if (bmTop && !raw.redraft) { const [p, f] = bmTop[0].split('|'); add('Players', `${P(p)} has had <b>${bmTop[1]} separate stints</b> with ${FA(+f)}.`); }
  // waivers
  const bb = A.bigBids[0]; if (bb) { const out = bb.end && bb.end.k === 'T' && bb.ed - bb.sd <= 3 ? `then traded him away ${bb.ed - bb.sd <= 1 ? 'the next day' : 'within days'}` : `and got ${n0(bb.pts)} started points from him`; add('Waiver Wire', `${FN(bb.fid, bb.sy)} spent a record <b>${money(A.bid(bb))}</b> to claim ${P(bb.pid)} in ${yr(bb.sy)}, ${out}.`); }
  const free = A.bestPickups.find(s => A.bid(s) === 0); if (free) add('Waiver Wire', `${P(free.pid)} cost ${FN(free.fid, free.sy)} nothing in ${yr(free.sy)} and returned <b>${n0(free.pts)} started points</b>.`);
  const bt = A.bidTrend.filter(b => b.n); if (bt.length > 1) add('Waiver Wire', `The average winning bid went from <b>${money(bt[0].avg.toFixed(2))}</b> in ${bt[0].y} to <b>${money(bt[bt.length - 1].avg.toFixed(2))}</b> in ${bt[bt.length - 1].y}.`);
  const tot = []; for (let f = 1; f <= NF; f++) tot.push([f, years.reduce((a, _, k) => a + A.faab[k][f].spent, 0)]); tot.sort((a, b) => b[1] - a[1]);
  if (tot[0][1] > 0) add('Waiver Wire', `${FA(tot[0][0])} has spent <b>$${n0(tot[0][1])}</b> in FAAB all-time, the most in the league. ${FA(tot[tot.length - 1][0])} has spent the least at $${n0(tot[tot.length - 1][1])}.`);
  const hr = [...A.hitRate].filter(h => h.n >= 30).sort((a, b) => b.rate - a.rate)[0]; if (hr) add('Waiver Wire', `${pct(hr.rate)} of ${FA(hr.f)}'s pickups turned into ${A.HIT}+ game starters, the best hit rate in the league.`);
  const busy = [...A.hitRate].sort((a, b) => b.n - a.n)[0]; add('Waiver Wire', `${FA(busy.f)} has made <b>${busy.n} pickups</b> since ${years[0]}, the most in the league.`);
  // trades
  const pr = Object.entries(A.partner).sort((a, b) => b[1] - a[1])[0]; const [pa, pb] = pr[0].split('-').map(Number); add('Trades', `${FA(pa)} and ${FA(pb)} have made <b>${pr[1]} trades</b> with each other, the most of any pair.`);
  const never = []; for (let a = 1; a <= NF; a++) for (let b = a + 1; b <= NF; b++) if (!A.partner[a + '-' + b]) never.push([a, b]);
  if (never.length) add('Trades', `<b>${never.length}</b> ${never.length === 1 ? 'pair of owners has' : 'pairs of owners have'} never made a trade with each other, including ${FA(never[0][0])} and ${FA(never[0][1])}.`);
  const trec = []; for (let f = 1; f <= NF; f++) { const ts = A.trades.filter(t => (t.f1 === f || t.f2 === f) && !t.open && (t.p1 + t.p2) > 0); trec.push([f, ts.filter(t => t.winner === f).length, ts.filter(t => t.winner && t.winner !== f).length]); }
  trec.sort((a, b) => (b[1] - b[2]) - (a[1] - a[2]));
  add('Trades', `By points received, ${FA(trec[0][0])} has the best trade record in the league at <b>${trec[0][1]}–${trec[0][2]}</b>. ${FA(trec[trec.length - 1][0])} is ${trec[trec.length - 1][1]}–${trec[trec.length - 1][2]}.`);
  const busiestSeason = []; years.forEach((y, yi) => { for (let f = 1; f <= NF; f++) busiestSeason.push([f, yi, A.faab[yi][f].trades]); }); busiestSeason.sort((a, b) => b[2] - a[2]);
  add('Trades', `${FN(busiestSeason[0][0], busiestSeason[0][1])} made <b>${busiestSeason[0][2]} trades</b> in ${years[busiestSeason[0][1]]}, the most by anyone in a single league year.`);
  const heist = [...A.trades].filter(t => t.p1 && t.p2).sort((a, b) => b.diff - a.diff)[0]; if (heist) add('Trades', `The most lopsided trade where both sides got points: ${FN(heist.winner, heist.yi, heist.d)} came out <b>${n0(heist.diff)} points</b> ahead in ${yr(heist.yi)}. <button class="tlink" data-t="${heist.i}">See the trade</button>`);
  const jr = A.journeys[0]; if (jr) add('Draft Picks', `${FN(jr.orig, A.trades[jr.hops[0].tr].yi)}'s ${jr.y} ${ord(jr.rd)}-round pick changed hands <b>${jr.hops.length} times</b> before it was used${jr.pid ? `, and became ${P(jr.pid)}` : ''}.`);
  // franchises
